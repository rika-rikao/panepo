<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel de Web - パネポン風対戦パズル</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root { --bg-color: #1a1a2e; }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: #fff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    /* メニュー */
    #menu-overlay {
      position: absolute; inset: 0; background: rgba(10, 10, 25, 0.95); z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 20px;
    }
    .title {
      font-size: 2.2rem; font-weight: 900; background: linear-gradient(45deg, #ff007f, #00d4ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
    }
    .btn {
      background: #0f3460; color: #fff; border: 2px solid #e94560; padding: 12px 28px;
      font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; min-width: 240px;
    }
    .btn:active { transform: scale(0.95); background: #e94560; }
    .input-box { padding: 10px; border-radius: 20px; border: 2px solid #4ecca3; background: #162447; color: #fff; text-align: center; width: 240px; outline: none; }
    
    /* ゲーム画面 */
    #game-container {
      display: flex; flex-direction: row; gap: 20px; width: 100%; height: 100%; padding: 10px;
      align-items: center; justify-content: center;
    }
    .board-wrapper { display: flex; flex-direction: column; align-items: center; }
    .board-header { font-size: 1rem; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; width: 100%; }
    .canvas-container { border: 4px solid #3282b8; border-bottom: none; border-radius: 6px 6px 0 0; background: #000; box-shadow: 0 0 15px rgba(0,0,0,0.8); overflow: hidden; touch-action: none; }
    
    @media (orientation: portrait) {
      #game-container { flex-direction: column; justify-content: space-evenly; }
      #rival-wrapper { transform: scale(0.65); transform-origin: center top; margin-top: -20px; margin-bottom: -30px; }
    }
    
    #controls { display: flex; gap: 20px; margin-top: 10px; }
    .action-btn { background: linear-gradient(135deg, #e94560, #ff6b6b); border: none; color: #fff; font-weight: bold; padding: 12px 24px; border-radius: 25px; }
    .action-btn:active { transform: scale(0.92); }
    #toast { position: absolute; top: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; border: 1px solid #4ecca3; display: none; z-index: 200; }
  </style>
</head>
<body>
  <div id="toast"></div>

  <div id="menu-overlay">
    <div id="main-menu" style="display:flex; flex-direction:column; gap:15px; align-items:center;">
      <h1 class="title">PANEL DE WEB</h1>
      <button class="btn" onclick="startSingleGame()">ひとりで練習</button>
      <button class="btn" onclick="showComMenu()">COMと対戦</button>
      <div style="border-top:1px solid #fff; width:100%; margin:10px 0;"></div>
      <button class="btn" onclick="createRoom()">オンライン: 部屋を作る</button>
      <input type="text" id="peer-target-id" class="input-box" placeholder="相手のIDを入力">
      <button class="btn" onclick="joinRoom()">オンライン: 部屋に入る</button>
      <div id="peer-info" style="font-size:0.9rem; color:#4ecca3;"></div>
    </div>
    
    <div id="com-menu" style="display:none; flex-direction:column; gap:15px; align-items:center;">
      <h2 style="color:#4ecca3">CPUレベル選択</h2>
      <button class="btn" onclick="startComGame(1)">Level 1 (やさしい)</button>
      <button class="btn" onclick="startComGame(2)">Level 2 (ふつう)</button>
      <button class="btn" onclick="startComGame(3)">Level 3 (むずかしい)</button>
      <button class="btn" onclick="startComGame(4)">Level 4 (げきむず)</button>
      <button class="btn" style="background:#444; border-color:#888;" onclick="backToMainMenu()">戻る</button>
    </div>
  </div>

  <div id="game-container">
    <div class="board-wrapper" id="my-wrapper">
      <div class="board-header">
        <span id="player-label">YOU</span>
        <span id="score-label">SCORE: 0</span>
      </div>
      <div class="canvas-container"><canvas id="my-canvas"></canvas></div>
      <div id="controls"><button class="action-btn" id="rise-btn">PUSH UP (せり上げ)</button></div>
    </div>
    <div class="board-wrapper" id="rival-wrapper" style="display: none;">
      <div class="board-header">
        <span style="color: #e94560;">RIVAL</span>
        <span id="rival-score-label">SCORE: 0</span>
      </div>
      <div class="canvas-container"><canvas id="rival-canvas"></canvas></div>
    </div>
  </div>

  <script>
    const COLS = 6, ROWS = 12, CELL_PX = 36;
    const COLORS = [
      { id: 1, bg: '#ff3366', symbol: '♥' }, { id: 2, bg: '#ffd700', symbol: '★' },
      { id: 3, bg: '#00d4ff', symbol: '◆' }, { id: 4, bg: '#00e676', symbol: '♣' },
      { id: 5, bg: '#ff9100', symbol: '▲' }
    ];

    // --- ゲームエンジン ---
    class PonEngine {
      constructor(onStateChange, onSendGarbage) {
        this.cols = COLS; this.rows = ROWS;
        this.grid = Array.from({ length: this.rows }, () => Array(this.cols).fill(null));
        this.nextRow = []; 
        this.riseOffset = 0; 
        this.riseSpeed = 0.0008; 
        this.stopTimer = 0;
        this.score = 0; this.chain = 0;
        this.gameOver = false;
        this.cursor = { x: 2, y: 6 };
        this.garbageQueue = [];
        this.onStateChange = onStateChange;
        this.onSendGarbage = onSendGarbage;
        this.initGrid(5);
      }

      initGrid(initRows) {
        for (let r = this.rows - initRows; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            this.grid[r][c] = this.getRandomBlock(c, r);
          }
        }
        this.nextRow = this.createNextRow();
      }

      getRandomBlock(c, r, avoidMatch = true) {
        let valid = [...COLORS].map(col => col.id);
        if (avoidMatch) {
          if (c >= 2 && this.grid[r] && this.grid[r][c-1] && this.grid[r][c-2] && this.grid[r][c-1].type === this.grid[r][c-2].type) {
            valid = valid.filter(t => t !== this.grid[r][c-1].type);
          }
          if (r <= this.rows - 3 && this.grid[r+1] && this.grid[r+2] && this.grid[r+1][c] && this.grid[r+2][c] && this.grid[r+1][c].type === this.grid[r+2][c].type) {
            valid = valid.filter(t => t !== this.grid[r+1][c].type);
          }
        }
        return { type: valid[Math.floor(Math.random() * valid.length)], state: 'normal', timer: 0, fallY: 0, chainEligible: false };
      }

      createNextRow() {
        const row = [];
        for (let c = 0; c < this.cols; c++) {
          let choices = [...COLORS].map(x => x.id);
          if (c >= 2 && row[c-1].type === row[c-2].type) {
            choices = choices.filter(t => t !== row[c-1].type);
          }
          row.push({ type: choices[Math.floor(Math.random() * choices.length)], state: 'normal', timer: 0, fallY: 0, chainEligible: false });
        }
        return row;
      }

      swap(c, r) {
        if (this.gameOver) return false;
        if (c < 0 || c >= this.cols - 1 || r < 0 || r >= this.rows) return false;
        const b1 = this.grid[r][c], b2 = this.grid[r][c + 1];
        
        if (b1 && (b1.state === 'match' || b1.state === 'fall' || b1.type === 'garbage')) return false;
        if (b2 && (b2.state === 'match' || b2.state === 'fall' || b2.type === 'garbage')) return false;

        this.grid[r][c] = b2; this.grid[r][c + 1] = b1;

        if (this.grid[r][c]) this.grid[r][c].chainEligible = false;
        if (this.grid[r][c+1]) this.grid[r][c+1].chainEligible = false;

        if (this.grid[r][c] && (r+1 >= this.rows || this.grid[r+1][c] === null)) { this.grid[r][c].state = 'hover'; this.grid[r][c].timer = 12; }
        if (this.grid[r][c+1] && (r+1 >= this.rows || this.grid[r+1][c+1] === null)) { this.grid[r][c+1].state = 'hover'; this.grid[r][c+1].timer = 12; }

        this.checkMatches();
        return true;
      }

      manualRise() {
        if (this.gameOver) return;
        this.riseOffset += 0.1;
        if (this.riseOffset >= 1.0) this.pushNewRow();
      }

      pushNewRow() {
        this.riseOffset = 0;
        for (let c = 0; c < this.cols; c++) {
          if (this.grid[0][c] !== null) {
            this.gameOver = true;
            if (this.onStateChange) this.onStateChange('gameover');
            return;
          }
        }
        for (let r = 0; r < this.rows - 1; r++) this.grid[r] = this.grid[r + 1];
        this.grid[this.rows - 1] = this.nextRow;
        this.nextRow = this.createNextRow();
        this.checkMatches(); 
      }

      addGarbage(w, h) { this.garbageQueue.push({ w, h }); }

      spawnGarbage() {
        if (this.garbageQueue.length === 0) return;
        const g = this.garbageQueue.shift();
        for (let r = 0; r < g.h; r++) {
          for (let c = 0; c < g.w; c++) {
            if (this.grid[r][c] !== null) { this.gameOver = true; return; }
            this.grid[r][c] = { type: 'garbage', state: 'fall', fallY: 0, timer: 0 };
          }
        }
      }

      transformGarbageNear(r, c) {
        [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr, nc]) => {
          if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
            const b = this.grid[nr][nc];
            if (b && b.type === 'garbage') {
              b.type = COLORS[Math.floor(Math.random()*COLORS.length)].id;
              b.state = 'hover'; b.timer = 15; b.chainEligible = true;
            }
          }
        });
      }

      update() {
        if (this.gameOver) return;

        if (this.stopTimer > 0) this.stopTimer--;
        else {
          this.riseOffset += this.riseSpeed;
          if (this.riseOffset >= 1.0) this.pushNewRow();
        }

        let needsMatchCheck = false;
        let isMoving = false;

        // 1. マッチ消去タイマー
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const b = this.grid[r][c];
            if (b && b.state === 'match') {
              isMoving = true; b.timer--;
              if (b.timer <= 0) {
                this.transformGarbageNear(r, c);
                this.grid[r][c] = null;
                for (let ur = r - 1; ur >= 0; ur--) {
                  const ub = this.grid[ur][c];
                  if (ub && ub.state === 'normal') { ub.state = 'hover'; ub.timer = 15; ub.chainEligible = true; }
                }
                needsMatchCheck = true;
              }
            }
          }
        }

        // 2. 落下処理
        for (let r = this.rows - 2; r >= 0; r--) {
          for (let c = 0; c < this.cols; c++) {
            const b = this.grid[r][c];
            if (!b) continue;

            if (b.state === 'hover') {
              isMoving = true; b.timer--;
              if (b.timer <= 0) { b.state = 'fall'; b.fallY = 0; }
            }

            if (b.state === 'fall') {
              isMoving = true;
              const below = this.grid[r+1][c];
              if (below === null) {
                b.fallY += 0.35;
                if (b.fallY >= 1.0) {
                  this.grid[r+1][c] = b; this.grid[r][c] = null; b.fallY -= 1.0;
                  if (r + 2 >= this.rows || this.grid[r+2][c] !== null) {
                    b.state = 'normal'; b.fallY = 0; needsMatchCheck = true;
                  }
                }
              } else {
                b.state = 'normal'; b.fallY = 0; needsMatchCheck = true;
              }
            }
            if (b.state === 'normal' && this.grid[r+1][c] === null) {
              b.state = 'hover'; b.timer = 10;
            }
          }
        }

        if (needsMatchCheck) this.checkMatches();
        if (!isMoving && this.garbageQueue.length > 0) this.spawnGarbage();
      }

      checkMatches() {
        let matchedPositions = new Set();
        // 横のチェック
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols - 2; c++) {
            const b1 = this.grid[r][c];
            if (!b1 || b1.state !== 'normal' || b1.type === 'garbage') continue;
            let matchCount = 1;
            for (let k = 1; c + k < this.cols; k++) {
              const b2 = this.grid[r][c+k];
              if (b2 && b2.state === 'normal' && b2.type === b1.type) matchCount++;
              else break;
            }
            if (matchCount >= 3) {
              for (let k = 0; k < matchCount; k++) matchedPositions.add(`${r},${c+k}`);
            }
          }
        }
        // 縦のチェック
        for (let c = 0; c < this.cols; c++) {
          for (let r = 0; r < this.rows - 2; r++) {
            const b1 = this.grid[r][c];
            if (!b1 || b1.state !== 'normal' || b1.type === 'garbage') continue;
            let matchCount = 1;
            for (let k = 1; r + k < this.rows; k++) {
              const b2 = this.grid[r+k][c];
              if (b2 && b2.state === 'normal' && b2.type === b1.type) matchCount++;
              else break;
            }
            if (matchCount >= 3) {
              for (let k = 0; k < matchCount; k++) matchedPositions.add(`${r+k},${c}`);
            }
          }
        }

        if (matchedPositions.size > 0) {
          let chainActive = false;
          matchedPositions.forEach(pos => {
            const [r, c] = pos.split(',').map(Number);
            const block = this.grid[r][c];
            if (block.chainEligible) chainActive = true;
            block.state = 'match'; block.timer = 40;
          });

          if (chainActive) this.chain++; else this.chain = 1;
          this.stopTimer = 50 + (matchedPositions.size * 10) + (this.chain * 10);
          this.score += matchedPositions.size * 10 * this.chain;

          if (this.onSendGarbage && (matchedPositions.size >= 4 || this.chain >= 2)) {
            const gw = Math.min(this.cols, 3 + (this.chain - 1));
            const gh = Math.max(1, Math.floor(matchedPositions.size / 4));
            this.onSendGarbage(gw, gh);
          }
        } else {
          let isMoving = false;
          for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
              const b = this.grid[r][c];
              if (b && (b.state === 'match' || b.state === 'fall' || b.state === 'hover')) isMoving = true;
            }
          }
          if (!isMoving) {
            this.chain = 0;
            for (let r = 0; r < this.rows; r++) {
              for (let c = 0; c < this.cols; c++) if (this.grid[r][c]) this.grid[r][c].chainEligible = false;
            }
          }
        }
      }
    }

    // --- 描画エンジン ---
    class BoardRenderer {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = COLS * CELL_PX;
        this.canvas.height = ROWS * CELL_PX + CELL_PX * 0.75; 
      }
      draw(engine) {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        const offsetY = engine.riseOffset * CELL_PX;

        for (let r = 0; r < engine.rows; r++) {
          for (let c = 0; c < engine.cols; c++) {
            const b = engine.grid[r][c];
            if (b) {
              const x = c * CELL_PX;
              const y = r * CELL_PX - offsetY + (b.fallY * CELL_PX);

              if (b.type === 'garbage') {
                ctx.fillStyle = '#6c757d'; ctx.fillRect(x+1, y+1, CELL_PX-2, CELL_PX-2);
                ctx.fillStyle = '#adb5bd'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('■', x+CELL_PX/2, y+CELL_PX/2);
              } else {
                const conf = COLORS.find(item => item.id === b.type);
                if (conf) {
                  ctx.fillStyle = (b.state === 'match' && Math.floor(b.timer/4)%2 === 0) ? '#fff' : conf.bg;
                  ctx.beginPath(); ctx.roundRect(x+2, y+2, CELL_PX-4, CELL_PX-4, 8); ctx.fill();
                  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(conf.symbol, x+CELL_PX/2, y+CELL_PX/2);
                }
              }
            }
          }
        }

        // 予告段
        for (let c = 0; c < engine.cols; c++) {
          const b = engine.nextRow[c];
          if (b) {
            const x = c * CELL_PX;
            const y = engine.rows * CELL_PX - offsetY;
            const conf = COLORS.find(item => item.id === b.type);
            if (conf) {
              ctx.globalAlpha = 0.35; 
              ctx.fillStyle = conf.bg;
              ctx.beginPath(); ctx.roundRect(x+2, y+2, CELL_PX-4, CELL_PX-4, 8); ctx.fill();
              ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(conf.symbol, x+CELL_PX/2, y+CELL_PX/2);
              ctx.globalAlpha = 1.0;  
            }
          }
        }

        // カーソル
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
        ctx.strokeRect(engine.cursor.x * CELL_PX - 2, engine.cursor.y * CELL_PX - offsetY - 2, CELL_PX * 2 + 4, CELL_PX + 4);

        if (engine.gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          ctx.fillStyle = '#ff3366'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GAME OVER', this.canvas.width/2, this.canvas.height/2);
        }
      }
    }

    // --- COM(AI) エンジン ---
    class ComAI {
      constructor(engine, level) {
        this.engine = engine; this.level = level;
        this.target = null;
        this.thinkInterval = [50, 35, 20, 5][level - 1]; 
        this.moveInterval = [15, 10, 5, 2][level - 1];   
        this.actionTimer = this.thinkInterval;
        this.moveTimer = 0;
        this.engine.riseSpeed = 0.0006 + (level * 0.0002); 
      }
      update() {
        if (this.engine.gameOver) return;
        if (this.target) {
          this.moveTimer--;
          if (this.moveTimer <= 0) {
            this.moveTimer = this.moveInterval;
            let moved = false;
            if (this.engine.cursor.x < this.target.x) { this.engine.cursor.x++; moved = true; }
            else if (this.engine.cursor.x > this.target.x) { this.engine.cursor.x--; moved = true; }
            else if (this.engine.cursor.y < this.target.y) { this.engine.cursor.y++; moved = true; }
            else if (this.engine.cursor.y > this.target.y) { this.engine.cursor.y--; moved = true; }
            
            if (!moved) {
              this.engine.swap(this.engine.cursor.x, this.engine.cursor.y);
              this.target = null;
              this.actionTimer = this.thinkInterval;
            }
          }
        } else {
          this.actionTimer--;
          if (this.actionTimer <= 0) this.think();
        }
      }
      think() {
        this.actionTimer = this.thinkInterval;
        let maxH = 0;
        for (let c=0; c<COLS; c++) { for (let r=0; r<ROWS; r++) { if (this.engine.grid[r][c]) { maxH = Math.max(maxH, ROWS-r); break; } } }
        
        let bestMoves = [];
        for (let r=0; r<ROWS; r++) {
          for (let c=0; c<COLS-1; c++) {
            if (this.canSwapAndMatch(r, c)) bestMoves.push({x:c, y:r});
          }
        }
        if (bestMoves.length > 0) {
          this.target = bestMoves[Math.floor(Math.random() * bestMoves.length)];
          this.moveTimer = this.moveInterval;
        } else {
          if (this.level >= 3 && maxH < ROWS - 4) {
            this.engine.manualRise();
          } else {
            this.target = { x: Math.floor(Math.random()*(COLS-1)), y: Math.floor(Math.random()*(ROWS-2))+2 };
            this.moveTimer = this.moveInterval;
          }
        }
      }
      canSwapAndMatch(r, c) {
        const b1 = this.engine.grid[r][c], b2 = this.engine.grid[r][c+1];
        if (b1 && b1.state !== 'normal') return false;
        if (b2 && b2.state !== 'normal') return false;
        if (!b1 && !b2) return false;
        if (b1 && b2 && b1.type === b2.type) return false;
        
        const temp = this.engine.grid.map(row => row.map(cell => cell ? {...cell} : null));
        let t = temp[r][c]; temp[r][c] = temp[r][c+1]; temp[r][c+1] = t;
        
        for (let rr=0; rr<ROWS; rr++) {
          for (let cc=0; cc<COLS-2; cc++) {
            if (temp[rr][cc] && temp[rr][cc].type!=='garbage' && temp[rr][cc+1] && temp[rr][cc+2] && temp[rr][cc].type===temp[rr][cc+1].type && temp[rr][cc].type===temp[rr][cc+2].type) return true;
          }
        }
        for (let cc=0; cc<COLS; cc++) {
          for (let rr=0; rr<ROWS-2; rr++) {
            if (temp[rr][cc] && temp[rr][cc].type!=='garbage' && temp[rr+1][cc] && temp[rr+2][cc] && temp[rr][cc].type===temp[rr+1][cc].type && temp[rr][cc].type===temp[rr+2][cc].type) return true;
          }
        }
        return false;
      }
    }

    // --- システム管理 ---
    let myEngine, rivalEngine, myRenderer, rivalRenderer, comAI = null;
    let peer = null, conn = null, isMultiplayer = false;

    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
    function showComMenu() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('com-menu').style.display = 'flex'; }
    function backToMainMenu() { document.getElementById('com-menu').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'; }

    function initGame() {
      myRenderer = new BoardRenderer('my-canvas'); rivalRenderer = new BoardRenderer('rival-canvas');
      myEngine = new PonEngine(
        (state) => { if (state === 'gameover' && conn) conn.send({ type: 'win' }); },
        (w, h) => { if (conn) conn.send({ type: 'garbage', w, h }); }
      );
      setupInput();
      requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
      if (myEngine) {
        myEngine.update(); myRenderer.draw(myEngine);
        document.getElementById('score-label').innerText = `SCORE: ${myEngine.score} | CHAIN: ${myEngine.chain}`;
      }
      if (isMultiplayer && rivalEngine) {
        if (comAI) comAI.update();
        rivalEngine.update(); rivalRenderer.draw(rivalEngine);
        document.getElementById('rival-score-label').innerText = `SCORE: ${rivalEngine.score}`;
      }
      requestAnimationFrame(gameLoop);
    }

    // --- 【修正版】タッチ・マウス操作（Pointer Events） ---
    function setupInput() {
      const cvs = document.getElementById('my-canvas');
      let startX = 0, startY = 0;
      let startCellX = 0, startCellY = 0;
      let isDown = false;

      cvs.addEventListener('pointerdown', (e) => {
        isDown = true;
        cvs.setPointerCapture(e.pointerId); // 指が枠外に出ても確実に追跡する
        const rect = cvs.getBoundingClientRect();
        startX = e.clientX - rect.left; 
        startY = e.clientY - rect.top;

        // 画面の実際の描画サイズを元に、現在の1マスの大きさを正確に計算
        const cellW = rect.width / COLS;
        const cellH = rect.height / (ROWS + 0.75); // 縦は12マス + 予告0.75マス分

        startCellX = Math.floor(startX / cellW);
        startCellY = Math.floor((startY + myEngine.riseOffset * cellH) / cellH);
      });

      cvs.addEventListener('pointerup', (e) => {
        if (!isDown) return;
        isDown = false;
        cvs.releasePointerCapture(e.pointerId);
        
        // 予告段や画面外をタッチしていた場合は無視
        if (startCellY < 0 || startCellY >= ROWS) return;

        const rect = cvs.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;
        
        const dx = endX - startX;
        const dy = endY - startY;

        // フリック判定の閾値を「現在の1マスの35%」に設定（左右全く同じ感覚に）
        const cellW = rect.width / COLS;
        const threshold = cellW * 0.35; 

        if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0) {
            // 右フリック: タッチしたブロックと「右」を入れ替え
            if (startCellX >= 0 && startCellX < COLS - 1) {
              myEngine.cursor.x = startCellX;
              myEngine.cursor.y = startCellY;
              myEngine.swap(startCellX, startCellY);
            }
          } else {
            // 左フリック: タッチしたブロックと「左」を入れ替え
            if (startCellX > 0 && startCellX < COLS) {
              myEngine.cursor.x = startCellX - 1;
              myEngine.cursor.y = startCellY;
              myEngine.swap(startCellX - 1, startCellY);
            }
          }
        } else if (Math.abs(dx) <= threshold && Math.abs(dy) <= threshold) {
          // フリックせずにタップしただけの場合
          if (startCellX >= 0 && startCellX < COLS - 1) {
            myEngine.cursor.x = startCellX;
          } else if (startCellX === COLS - 1) { 
            myEngine.cursor.x = COLS - 2; // 右端をタップした場合はカーソルを一つ左に置く
          }
          myEngine.cursor.y = startCellY;
        }
      });

      // 操作がシステムによってキャンセルされたときの保険
      cvs.addEventListener('pointercancel', () => { isDown = false; });

      document.getElementById('rise-btn').addEventListener('click', () => myEngine.manualRise());

      window.addEventListener('keydown', (e) => {
        if (!myEngine) return;
        if (e.key === 'ArrowUp' && myEngine.cursor.y > 0) myEngine.cursor.y--;
        if (e.key === 'ArrowDown' && myEngine.cursor.y < ROWS - 1) myEngine.cursor.y++;
        if (e.key === 'ArrowLeft' && myEngine.cursor.x > 0) myEngine.cursor.x--;
        if (e.key === 'ArrowRight' && myEngine.cursor.x < COLS - 2) myEngine.cursor.x++;
        if (e.key === ' ') myEngine.swap(myEngine.cursor.x, myEngine.cursor.y);
        if (e.key === 'Shift') myEngine.manualRise();
      });
    }

    // --- ゲーム開始用関数 ---
    function startSingleGame() { document.getElementById('menu-overlay').style.display = 'none'; initGame(); }
    
    function startComGame(level) {
      document.getElementById('menu-overlay').style.display = 'none';
      document.getElementById('rival-wrapper').style.display = 'flex';
      initGame();
      rivalEngine = new PonEngine(
        (state) => { if (state === 'gameover') showToast('COMがゲームオーバー！あなたの勝ち！'); },
        (w, h) => { myEngine.addGarbage(w, h); }
      );
      myEngine.onSendGarbage = (w, h) => rivalEngine.addGarbage(w, h);
      comAI = new ComAI(rivalEngine, level);
      isMultiplayer = true;
    }

    // --- オンライン対戦 (PeerJS) ---
    function setupPeer(onOpen) {
      peer = new Peer();
      peer.on('open', (id) => onOpen(id));
      peer.on('connection', (c) => { conn = c; bindConnEvents(); startOnlineGame(false); });
    }
    function bindConnEvents() {
      conn.on('data', (data) => {
        if (data.type === 'sync') {
          rivalEngine.grid = data.grid; 
          rivalEngine.nextRow = data.nextRow; 
          rivalEngine.riseOffset = data.riseOffset; 
          rivalEngine.score = data.score;
        } else if (data.type === 'garbage') {
          myEngine.addGarbage(data.w, data.h); showToast('おじゃまブロックが飛んできた！');
        } else if (data.type === 'win') showToast('相手がゲームオーバー！あなたの勝利！');
      });
    }
    function createRoom() {
      setupPeer((id) => {
        document.getElementById('peer-info').innerHTML = `部屋ID: <b>${id}</b><br>相手にこのIDを伝えてください`;
        navigator.clipboard?.writeText(id); showToast('IDをコピーしました！待機中...');
      });
    }
    function joinRoom() {
      const targetId = document.getElementById('peer-target-id').value.trim();
      if (!targetId) { showToast('IDを入力してください'); return; }
      setupPeer(() => { conn = peer.connect(targetId); conn.on('open', () => { bindConnEvents(); startOnlineGame(true); }); });
    }
    function startOnlineGame(isGuest) {
      isMultiplayer = true; comAI = null;
      document.getElementById('menu-overlay').style.display = 'none';
      document.getElementById('rival-wrapper').style.display = 'flex';
      initGame(); rivalEngine = new PonEngine();
      setInterval(() => {
        if (conn && conn.open) conn.send({ 
          type: 'sync', grid: myEngine.grid, nextRow: myEngine.nextRow, 
          riseOffset: myEngine.riseOffset, score: myEngine.score 
        });
      }, 100);
      showToast(isGuest ? '接続完了！対戦開始！' : '相手が参加しました！対戦開始！');
    }
  </script>
</body>
</html>
