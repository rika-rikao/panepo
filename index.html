<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel de Web - パネポン風対戦パズル</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root { --bg-color: #1a1a2e; }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: #fff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    
    .small-btn { background: #0f3460; color: #fff; border: 1px solid #4ecca3; padding: 6px 12px; font-size: 0.9rem; border-radius: 15px; cursor: pointer; }
    .small-btn:active { background: #e94560; }

    /* メニュー */
    #menu-overlay {
      position: absolute; inset: 0; background: rgba(10, 10, 25, 0.95); z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 20px;
    }
    .title {
      font-size: 2.2rem; font-weight: 900; background: linear-gradient(45deg, #ff007f, #00d4ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
    }
    .btn {
      background: #0f3460; color: #fff; border: 2px solid #e94560; padding: 12px 28px;
      font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; min-width: 240px;
    }
    .btn:active { transform: scale(0.95); background: #e94560; }
    .btn:disabled { background: #555; border-color: #777; cursor: not-allowed; transform: none; }
    .input-box { padding: 10px; border-radius: 20px; border: 2px solid #4ecca3; background: #162447; color: #fff; text-align: center; width: 240px; outline: none; }
    
    /* 設定画面 */
    #settings-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 300;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    .settings-box {
      background: #162447; padding: 20px; border-radius: 15px; border: 2px solid #4ecca3;
      width: 90%; max-width: 450px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
    }
    .settings-section { border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
    .config-btn { background: #0f3460; border: 1px solid #4ecca3; color: white; border-radius: 5px; padding: 6px; cursor: pointer; font-size: 0.85rem; width: 110px; text-align: center; }
    .config-btn:active { background: #e94560; }

    /* ゲーム画面全体 */
    #game-area {
      display: none; width: 100vw; height: 100vh; position: relative;
      flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }

    #game-container {
      display: flex; flex-direction: row; gap: 10px; width: 100%; height: 100%; padding: 10px;
      align-items: center; justify-content: center; flex: 1;
    }
    
    .board-wrapper { display: flex; flex-direction: column; align-items: center; z-index: 10; transition: transform 0.1s ease-out; }
    .board-header { font-size: 0.95rem; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; width: 100%; }
    .canvas-container { border: 4px solid #3282b8; border-bottom: none; border-radius: 6px 6px 0 0; background: #000; box-shadow: 0 0 15px rgba(0,0,0,0.8); overflow: hidden; touch-action: none; }
    
    /* 予告エリア */
    .garbage-preview-box {
      height: 24px; width: 100%; margin-bottom: 4px; display: flex; gap: 4px; align-items: center;
      background: rgba(0,0,0,0.45); border-radius: 6px; padding: 2px 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15);
    }
    .preview-label { font-size: 0.7rem; color: #4ecca3; margin-right: 4px; font-weight: bold; }
    .preview-list { display: flex; gap: 4px; align-items: center; height: 100%; overflow: hidden; }

    .action-btn { background: linear-gradient(135deg, #e94560, #ff6b6b); border: none; color: #fff; font-weight: bold; padding: 12px; border-radius: 25px; width: 100%; cursor: pointer; }
    .action-btn:active { transform: scale(0.92); }
    .retire-btn { background: linear-gradient(135deg, #d90429, #ef233c); }
    
    .switch-wrapper { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: #4ecca3; }
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #e94560; }

    /* UI配置制御 (利き手モード) */
    .absolute-top { position: absolute; top: 12px; padding: 8px 16px; font-size: 0.85rem; width: auto; z-index: 100; font-weight: bold; border-radius: 20px; }
    .right-handed .absolute-top { left: 12px; right: auto; }
    .left-handed .absolute-top { right: 12px; left: auto; }

    /* 横画面時の左右並び順 */
    .right-handed #controls-container { order: 1; }
    .right-handed #my-wrapper { order: 2; }
    .right-handed #rival-wrapper { order: 3; }
    
    .left-handed #controls-container { order: 3; }
    .left-handed #my-wrapper { order: 2; }
    .left-handed #rival-wrapper { order: 1; }

    #toast { position: absolute; top: 20px; background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 20px; border: 1px solid #4ecca3; display: none; z-index: 400; font-weight: bold; }
  </style>
</head>
<body>
  <div id="toast"></div>

  <!-- 設定画面 -->
  <div id="settings-overlay">
    <div class="settings-box">
      <h2 style="text-align: center; color: #4ecca3;">設定</h2>
      
      <div class="settings-section">
        <h3>🎵 BGM設定</h3>
        <p style="font-size:0.8rem; color:#aaa; margin-bottom: 10px;">ファイルやフォルダを追加して再生（リピート対応）</p>
        <div style="display:flex; gap:10px;">
          <label class="small-btn">ファイル選択<input type="file" id="bgm-file-input" multiple accept="audio/*" style="display:none;"></label>
          <label class="small-btn">フォルダ選択<input type="file" id="bgm-dir-input" multiple webkitdirectory directory accept="audio/*" style="display:none;"></label>
        </div>
        <div style="margin-top: 10px; font-size: 0.9rem;">
          音量: <span id="volume-val">50</span>%<br>
          <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.5" style="width:100%; margin-top:5px;">
        </div>
      </div>

      <div class="settings-section">
        <h3>🎮 キー・パッド設定</h3>
        <p style="font-size:0.8rem; color:#aaa; margin-bottom: 5px;">変更したい枠を押してから、キーやボタンを入力してください。</p>
        <div id="key-config-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>

      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="closeSettings()">閉じる</button>
    </div>
  </div>

  <!-- リザルト ＆ 再戦モーダル -->
  <div id="result-overlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.85); z-index:250; flex-direction:column; align-items:center; justify-content:center;">
    <div style="background:#162447; padding:30px; border-radius:15px; border:2px solid #e94560; text-align:center; min-width:300px;">
      <h2 id="result-title" style="color:#ff007f; margin-bottom:15px; font-size:2rem;"></h2>
      <div id="result-status" style="margin-bottom:20px; color:#4ecca3; font-size:1rem; height:20px;"></div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button class="btn" id="result-rematch-btn" onclick="requestRematch()">もう一度対戦する</button>
        <button class="btn retire-btn" onclick="exitGame()">タイトルへ戻る</button>
      </div>
    </div>
  </div>

  <!-- メニュー -->
  <div id="menu-overlay">
    <button class="small-btn" style="position: absolute; top: 15px; right: 15px; padding: 8px 16px;" onclick="openSettings()">⚙️設定</button>

    <div id="main-menu" style="display:flex; flex-direction:column; gap:15px; align-items:center;">
      <h1 class="title">PANEL DE WEB</h1>
      
      <div style="font-size: 0.9rem; color: #4ecca3; display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
        <span>自分のハンデ(有利さ):</span>
        <select id="handicap-val" class="input-box" style="width: auto; padding: 5px; font-size: 0.85rem; border-radius: 10px;">
          <option value="1">1: 不利 (激ムズ)</option>
          <option value="2">2: やや不利</option>
          <option value="3" selected>3: 普通</option>
          <option value="4">4: やや有利</option>
          <option value="5">5: 有利 (やさしい)</option>
        </select>
      </div>

      <button class="btn" onclick="startSingleGame()">ひとりで練習</button>
      <button class="btn" onclick="showComMenu()">COMと対戦</button>
      
      <div style="border-top:1px solid rgba(255,255,255,0.2); width:100%; margin:5px 0;"></div>
      
      <!-- 短縮・合言葉対応オンライン対戦UI -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <input type="text" id="peer-room-id" class="input-box" placeholder="部屋コード (空欄で自動発行)" maxlength="10">
        <div style="display:flex; gap:10px;">
          <button class="btn" style="min-width:115px; padding:10px 16px; font-size:1rem;" onclick="createRoom()">部屋を作る</button>
          <button class="btn" style="min-width:115px; padding:10px 16px; font-size:1rem;" onclick="joinRoom()">部屋に入る</button>
        </div>
      </div>
      <div id="peer-info" style="font-size:0.9rem; color:#4ecca3; text-align:center; min-height:22px;"></div>
    </div>
    
    <div id="com-menu" style="display:none; flex-direction:column; gap:15px; align-items:center;">
      <h2 style="color:#4ecca3">CPUレベル選択</h2>
      <button class="btn" onclick="startComGame(1)">Level 1 (やさしい)</button>
      <button class="btn" onclick="startComGame(2)">Level 2 (ふつう)</button>
      <button class="btn" onclick="startComGame(3)">Level 3 (むずかしい)</button>
      <button class="btn" onclick="startComGame(4)">Level 4 (げきむず)</button>
      <button class="btn" style="background:#444; border-color:#888;" onclick="backToMainMenu()">戻る</button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-area" class="right-handed">
    <!-- 退出ボタン -->
    <button id="exit-btn" class="action-btn retire-btn absolute-top" onclick="exitGame()">退出 (リタイア)</button>

    <div id="game-container">
      <div id="controls-container" style="display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; z-index: 20; width: 110px;">
        <label class="switch-wrapper" style="background: rgba(0,0,0,0.85); padding: 6px 8px; border-radius: 10px; flex-direction: column; gap: 4px; border: 1px solid #4ecca3;">
          <input type="checkbox" id="handedness-toggle" onchange="toggleHandedness()"> <span id="handedness-text" style="font-size: 0.75rem;">右利きモード</span>
        </label>
        <label class="switch-wrapper" style="background: rgba(0,0,0,0.65); padding: 6px 8px; border-radius: 10px; flex-direction: column; gap: 4px; border: 1px solid rgba(255,255,255,0.1);">
          <input type="checkbox" id="continuous-swipe" checked>連続移動
        </label>
        <button class="action-btn" id="rise-btn" style="height: 60px; font-size: 1.05rem; box-shadow: 0 4px #8a0c24;">PUSH UP</button>
      </div>

      <div class="board-wrapper" id="my-wrapper">
        <div class="garbage-preview-box">
          <span class="preview-label">予告</span>
          <div id="my-garbage-preview" class="preview-list"></div>
        </div>
        <div class="board-header">
          <span id="player-label">YOU</span>
          <span id="score-label">SCORE: 0</span>
        </div>
        <div class="canvas-container"><canvas id="my-canvas"></canvas></div>
      </div>
      
      <div class="board-wrapper" id="rival-wrapper" style="display: none;">
        <div class="garbage-preview-box">
          <span class="preview-label">予告</span>
          <div id="rival-garbage-preview" class="preview-list"></div>
        </div>
        <div class="board-header">
          <span style="color: #e94560;">RIVAL</span>
          <span id="rival-score-label">SCORE: 0</span>
        </div>
        <div class="canvas-container"><canvas id="rival-canvas"></canvas></div>
      </div>
    </div>
  </div>

  <script>
    const COLS = 6, ROWS = 12, CELL_PX = 36;
    const COLORS = [
      { id: 1, bg: '#ff3366', symbol: '♥' }, { id: 2, bg: '#ffd700', symbol: '★' },
      { id: 3, bg: '#00d4ff', symbol: '◆' }, { id: 4, bg: '#00e676', symbol: '♣' },
      { id: 5, bg: '#ff9100', symbol: '▲' }
    ];

    // --- コンフィグ・BGM管理 ---
    let keyConfig = { Up: 'ArrowUp', Down: 'ArrowDown', Left: 'ArrowLeft', Right: 'ArrowRight', Swap: 'Space', Rise: 'ShiftLeft' };
    let padConfig = { Up: 12, Down: 13, Left: 14, Right: 15, Swap: 0, Rise: 5 };
    
    try {
      const sKey = localStorage.getItem('pdw_key');
      const sPad = localStorage.getItem('pdw_pad');
      if (sKey) keyConfig = { ...keyConfig, ...JSON.parse(sKey) };
      if (sPad) padConfig = { ...padConfig, ...JSON.parse(sPad) };
    } catch(e) {}

    let assigningAction = null, assignType = null;
    const bgmAudio = new Audio();
    let bgmPlaylist = [], currentBgmIndex = 0;

    document.getElementById('bgm-volume').addEventListener('input', (e) => {
      bgmAudio.volume = e.target.value;
      document.getElementById('volume-val').innerText = Math.floor(e.target.value * 100);
    });

    function handleBgmFiles(files) {
      bgmPlaylist = Array.from(files).filter(f => f.type.startsWith('audio/'));
      currentBgmIndex = 0;
      if (bgmPlaylist.length > 0) playBgmTrack();
    }
    document.getElementById('bgm-file-input').addEventListener('change', e => handleBgmFiles(e.target.files));
    document.getElementById('bgm-dir-input').addEventListener('change', e => handleBgmFiles(e.target.files));
    
    function playBgmTrack() {
      if (bgmPlaylist.length === 0) return;
      bgmAudio.src = URL.createObjectURL(bgmPlaylist[currentBgmIndex]);
      bgmAudio.play().catch(e => showToast('BGMの自動再生がブロックされました'));
    }
    bgmAudio.addEventListener('ended', () => {
      currentBgmIndex = (currentBgmIndex + 1) % bgmPlaylist.length;
      playBgmTrack();
    });

    function openSettings() { 
      document.getElementById('settings-overlay').style.display = 'flex'; 
      renderConfigUI();
    }
    function closeSettings() { 
      document.getElementById('settings-overlay').style.display = 'none'; 
      assigningAction = null;
      localStorage.setItem('pdw_key', JSON.stringify(keyConfig));
      localStorage.setItem('pdw_pad', JSON.stringify(padConfig));
    }

    function renderConfigUI() {
      const list = document.getElementById('key-config-list');
      list.innerHTML = '';
      Object.keys(keyConfig).forEach(action => {
        const row = document.createElement('div');
        row.style.display = 'flex'; row.style.justifyContent = 'space-between'; row.style.alignItems = 'center';
        
        const lbl = document.createElement('span'); lbl.innerText = action; lbl.style.width = '50px'; lbl.style.fontSize = '0.9rem';
        
        const kBtn = document.createElement('button'); kBtn.className = 'config-btn';
        kBtn.innerText = `Key: ${keyConfig[action].replace('Arrow','')}`;
        kBtn.onclick = () => { assigningAction = action; assignType = 'key'; kBtn.innerText = '押してください'; };
        
        const pBtn = document.createElement('button'); pBtn.className = 'config-btn';
        pBtn.innerText = `Pad: ${padConfig[action] !== null ? padConfig[action] : 'なし'}`;
        pBtn.onclick = () => { assigningAction = action; assignType = 'pad'; pBtn.innerText = '押してください'; };
        
        row.append(lbl, kBtn, pBtn);
        list.appendChild(row);
      });
    }

    setInterval(() => {
      if (assigningAction && assignType === 'pad') {
        const pad = navigator.getGamepads()[0];
        if (pad) {
          pad.buttons.forEach((b, i) => {
            if (b.pressed) {
              padConfig[assigningAction] = i;
              assigningAction = null;
              renderConfigUI();
            }
          });
        }
      }
    }, 1000 / 30);


    // --- ゲームエンジン ---
    class PonEngine {
      constructor(onStateChange, onSendGarbage, handicap = 3) {
        this.cols = COLS; this.rows = ROWS;
        this.handicap = handicap;
        this.grid = Array.from({ length: this.rows }, () => Array(this.cols).fill(null));
        this.nextRow = []; 
        this.riseOffset = 0; 
        
        this.riseSpeed = 0.0008 - (handicap - 3) * 0.0002;
        if (this.riseSpeed < 0.0002) this.riseSpeed = 0.0002;

        this.stopTimer = 0;
        this.score = 0; this.chain = 0;
        this.gameOver = false;
        this.cursor = { x: 2, y: 6 };
        this.garbageQueue = [];
        this.onStateChange = onStateChange;
        this.onSendGarbage = onSendGarbage;
        
        this.isRisingManualBtn = false;
        this.isRisingManualKey = false;
        this.isRisingManualPad = false;

        this.initGrid(5);
      }

      initGrid(initRows) {
        for (let r = this.rows - initRows; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) this.grid[r][c] = this.getRandomBlock(c, r);
        }
        this.nextRow = this.createNextRow();
      }

      getRandomBlock(c, r, avoidMatch = true) {
        let valid = [...COLORS].map(col => col.id);
        if (avoidMatch) {
          if (c >= 2 && this.grid[r] && this.grid[r][c-1] && this.grid[r][c-2] && this.grid[r][c-1].type === this.grid[r][c-2].type) {
            valid = valid.filter(t => t !== this.grid[r][c-1].type);
          }
          if (r <= this.rows - 3 && this.grid[r+1] && this.grid[r+2] && this.grid[r+1][c] && this.grid[r+2][c] && this.grid[r+1][c].type === this.grid[r+2][c].type) {
            valid = valid.filter(t => t !== this.grid[r+1][c].type);
          }
        }
        return { type: valid[Math.floor(Math.random() * valid.length)], state: 'normal', timer: 0, fallY: 0, chainEligible: false };
      }

      createNextRow() {
        const row = [];
        for (let c = 0; c < this.cols; c++) {
          let choices = [...COLORS].map(x => x.id);
          if (c >= 2 && row[c-1].type === row[c-2].type) choices = choices.filter(t => t !== row[c-1].type);
          row.push({ type: choices[Math.floor(Math.random() * choices.length)], state: 'normal', timer: 0, fallY: 0, chainEligible: false });
        }
        return row;
      }

      swap(c, r) {
        if (this.gameOver) return false;
        if (c < 0 || c >= this.cols - 1 || r < 0 || r >= this.rows) return false;
        const b1 = this.grid[r][c], b2 = this.grid[r][c + 1];
        
        const isFloating = (b, c_idx) => b && r < this.rows - 1 && this.grid[r+1][c_idx] === null;

        if (b1 && b1.state !== 'normal') return false;
        if (b2 && b2.state !== 'normal') return false;
        if (b1 && b1.type === 'garbage') return false;
        if (b2 && b2.type === 'garbage') return false;
        if (isFloating(b1, c) || isFloating(b2, c + 1)) return false;

        this.grid[r][c] = b2; this.grid[r][c + 1] = b1;

        if (this.grid[r][c]) this.grid[r][c].chainEligible = false;
        if (this.grid[r][c+1]) this.grid[r][c+1].chainEligible = false;

        if (this.grid[r][c] && r+1 < this.rows && this.grid[r+1][c] === null) { this.grid[r][c].state = 'hover'; this.grid[r][c].timer = 12; }
        if (this.grid[r][c+1] && r+1 < this.rows && this.grid[r+1][c+1] === null) { this.grid[r][c+1].state = 'hover'; this.grid[r][c+1].timer = 12; }

        this.checkMatches();
        return true;
      }

      manualRiseStep() {
        if (this.gameOver) return;
        this.stopTimer = 0; 
        this.riseOffset += 0.035; 
        if (this.riseOffset >= 1.0) this.pushNewRow();
      }

      pushNewRow() {
        this.riseOffset = 0;
        for (let c = 0; c < this.cols; c++) {
          if (this.grid[0][c] !== null) {
            this.gameOver = true;
            if (this.onStateChange) this.onStateChange('gameover');
            return;
          }
        }
        for (let r = 0; r < this.rows - 1; r++) this.grid[r] = this.grid[r + 1];
        this.grid[this.rows - 1] = this.nextRow;
        this.nextRow = this.createNextRow();
        this.checkMatches(); 
      }

      addGarbage(w, h) { 
        let adjustedH = h;
        if (this.handicap === 1) adjustedH = Math.floor(h * 1.5);
        else if (this.handicap === 2) adjustedH = Math.floor(h * 1.25);
        else if (this.handicap === 4) adjustedH = Math.ceil(h * 0.75);
        else if (this.handicap === 5) adjustedH = Math.ceil(h * 0.5);
        
        if (adjustedH < 1) adjustedH = 1;
        // 予告が出てから実際に降るまでのディレイ(150フレーム=約2.5秒)を追加
        this.garbageQueue.push({ w, h: adjustedH, delay: 150 }); 
      }

      spawnGarbage() {
        const g = this.garbageQueue.shift();
        const groupId = Date.now() + Math.random();
        const startCol = Math.floor(Math.random() * (this.cols - g.w + 1));
        for (let r = 0; r < g.h; r++) {
          for (let c = 0; c < g.w; c++) {
            const actualCol = startCol + c;
            if (this.grid[r][actualCol] !== null) { 
              this.gameOver = true;
              if (this.onStateChange) this.onStateChange('gameover');
              return; 
            }
            this.grid[r][actualCol] = { type: 'garbage', state: 'fall', fallY: 0, timer: 0, groupId: groupId };
          }
        }
      }

      transformGarbageNear(r, c) {
        let triggeredGroupIds = new Set();
        
        // 最初の着火元を探索
        [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr, nc]) => {
          if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
            const b = this.grid[nr][nc];
            if (b && b.type === 'garbage' && b.groupId) triggeredGroupIds.add(b.groupId);
          }
        });

        if (triggeredGroupIds.size > 0) {
          // 隣接するお邪魔ブロックの連鎖着火（誘爆）
          let newlyAdded = true;
          while (newlyAdded) {
            newlyAdded = false;
            for (let rr = 0; rr < this.rows; rr++) {
              for (let cc = 0; cc < this.cols; cc++) {
                const b = this.grid[rr][cc];
                if (b && b.type === 'garbage' && triggeredGroupIds.has(b.groupId)) {
                  // 隣接マスをチェック
                  [[rr-1,cc],[rr+1,cc],[rr,cc-1],[rr,cc+1]].forEach(([nr, nc]) => {
                    if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
                      const adjB = this.grid[nr][nc];
                      if (adjB && adjB.type === 'garbage' && adjB.groupId && adjB.groupId !== b.groupId) {
                        if (!triggeredGroupIds.has(adjB.groupId)) {
                          triggeredGroupIds.add(adjB.groupId);
                          newlyAdded = true;
                        }
                      }
                    }
                  });
                }
              }
            }
          }

          // 各グループごとに「一番下の段」だけを通常ブロックに変換
          triggeredGroupIds.forEach(groupId => {
            let maxR = -1;
            for (let rr = 0; rr < this.rows; rr++) {
              for (let cc = 0; cc < this.cols; cc++) {
                const b = this.grid[rr][cc];
                if (b && b.type === 'garbage' && b.groupId === groupId) {
                  if (rr > maxR) maxR = rr;
                }
              }
            }
            if (maxR !== -1) {
              for (let cc = 0; cc < this.cols; cc++) {
                const b = this.grid[maxR][cc];
                if (b && b.type === 'garbage' && b.groupId === groupId) {
                  b.type = COLORS[Math.floor(Math.random() * COLORS.length)].id;
                  b.state = 'hover'; 
                  b.timer = 15; 
                  b.chainEligible = true; 
                  delete b.groupId; 
                }
              }
            }
          });
        }
      }

      update() {
        if (this.gameOver) return;

        if (this.isRisingManualBtn || this.isRisingManualKey || this.isRisingManualPad) {
          this.manualRiseStep();
        } else {
          if (this.stopTimer > 0) this.stopTimer--;
          else {
            this.riseOffset += this.riseSpeed;
            if (this.riseOffset >= 1.0) this.pushNewRow();
          }
        }

        let needsMatchCheck = false;
        let isMoving = false;

        // 消去アニメーション
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const b = this.grid[r][c];
            if (b && b.state === 'match') {
              isMoving = true; b.timer--;
              if (b.timer <= 0) {
                this.transformGarbageNear(r, c);
                this.grid[r][c] = null;
                for (let ur = r - 1; ur >= 0; ur--) {
                  const ub = this.grid[ur][c];
                  if (ub && ub.state === 'normal') { ub.state = 'hover'; ub.timer = 15; ub.chainEligible = true; }
                }
                needsMatchCheck = true;
              }
            }
          }
        }

        // おじゃまブロック塊の落下・着地判定
        const garbageGroups = new Map();
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const b = this.grid[r][c];
            if (b && b.type === 'garbage' && b.groupId) {
              if (!garbageGroups.has(b.groupId)) garbageGroups.set(b.groupId, []);
              garbageGroups.get(b.groupId).push({ r, c, block: b });
            }
          }
        }

        garbageGroups.forEach((cells, groupId) => {
          const leader = cells[0].block;
          
          if (leader.state === 'hover') {
            isMoving = true;
            leader.timer--;
            cells.forEach(item => item.block.timer = leader.timer);
            if (leader.timer <= 0) {
              cells.forEach(item => { item.block.state = 'fall'; item.block.fallY = 0; });
            }
          }

          if (leader.state === 'fall') {
            isMoving = true;
            let canFall = true;
            for (const item of cells) {
              if (item.r + 1 >= this.rows) { canFall = false; break; }
              const below = this.grid[item.r + 1][item.c];
              if (below !== null && below.groupId !== groupId) { canFall = false; break; }
            }

            if (!canFall) {
              cells.forEach(item => {
                item.block.state = 'normal';
                item.block.fallY = 0;
              });
              needsMatchCheck = true;
            } else {
              leader.fallY += 0.35;
              cells.forEach(item => item.block.fallY = leader.fallY);
              if (leader.fallY >= 1.0) {
                cells.sort((a, b) => b.r - a.r);
                for (const item of cells) {
                  this.grid[item.r + 1][item.c] = item.block;
                  this.grid[item.r][item.c] = null;
                  item.block.fallY = 0;
                  item.r += 1;
                }
                leader.fallY = 0;
                let hitBottom = false;
                for (const item of cells) {
                  if (item.r + 1 >= this.rows || (this.grid[item.r + 1][item.c] !== null && this.grid[item.r + 1][item.c].groupId !== groupId)) {
                    hitBottom = true; break;
                  }
                }
                if (hitBottom) {
                  cells.forEach(item => {
                    item.block.state = 'normal';
                    item.block.fallY = 0;
                  });
                  needsMatchCheck = true;
                }
              }
            }
          }

          if (leader.state === 'normal') {
            let supported = false;
            for (const item of cells) {
              if (item.r + 1 >= this.rows) { supported = true; break; }
              const below = this.grid[item.r + 1][item.c];
              if (below !== null && below.groupId !== groupId) { supported = true; break; }
            }
            if (!supported) {
              cells.forEach(item => {
                item.block.state = 'hover';
                item.block.timer = 10;
              });
            }
          }
        });

        // 通常ブロックの落下処理
        for (let r = this.rows - 2; r >= 0; r--) {
          for (let c = 0; c < this.cols; c++) {
            const b = this.grid[r][c];
            if (!b || b.type === 'garbage') continue;

            if (b.state === 'hover') {
              isMoving = true; b.timer--;
              if (b.timer <= 0) { b.state = 'fall'; b.fallY = 0; }
            }

            if (b.state === 'fall') {
              isMoving = true;
              const below = this.grid[r+1][c];
              if (below === null) {
                b.fallY += 0.35;
                if (b.fallY >= 1.0) {
                  this.grid[r+1][c] = b; this.grid[r][c] = null; b.fallY -= 1.0;
                  if (r + 2 >= this.rows || this.grid[r+2][c] !== null) {
                    b.state = 'normal'; b.fallY = 0; needsMatchCheck = true;
                  }
                }
              } else {
                b.state = 'normal'; b.fallY = 0; needsMatchCheck = true;
              }
            }
            if (b.state === 'normal' && r+1 < this.rows && this.grid[r+1][c] === null) {
              b.state = 'hover'; b.timer = 10;
            }
          }
        }

        if (needsMatchCheck) this.checkMatches();
        
        // 予告ブロックの遅延と落下
        if (!isMoving && this.garbageQueue.length > 0) {
          if (this.garbageQueue[0].delay > 0) {
            this.garbageQueue[0].delay--;
          } else {
            this.spawnGarbage();
          }
        }
      }

      checkMatches() {
        let matchedPositions = new Set();
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols - 2; c++) {
            const b1 = this.grid[r][c];
            if (!b1 || b1.state !== 'normal' || b1.type === 'garbage') continue;
            let matchCount = 1;
            for (let k = 1; c + k < this.cols; k++) {
              const b2 = this.grid[r][c+k];
              if (b2 && b2.state === 'normal' && b2.type === b1.type) matchCount++;
              else break;
            }
            if (matchCount >= 3) {
              for (let k = 0; k < matchCount; k++) matchedPositions.add(`${r},${c+k}`);
            }
          }
        }
        for (let c = 0; c < this.cols; c++) {
          for (let r = 0; r < this.rows - 2; r++) {
            const b1 = this.grid[r][c];
            if (!b1 || b1.state !== 'normal' || b1.type === 'garbage') continue;
            let matchCount = 1;
            for (let k = 1; r + k < this.rows; k++) {
              const b2 = this.grid[r+k][c];
              if (b2 && b2.state === 'normal' && b2.type === b1.type) matchCount++;
              else break;
            }
            if (matchCount >= 3) {
              for (let k = 0; k < matchCount; k++) matchedPositions.add(`${r+k},${c}`);
            }
          }
        }

        if (matchedPositions.size > 0) {
          let chainActive = false;
          matchedPositions.forEach(pos => {
            const [r, c] = pos.split(',').map(Number);
            const block = this.grid[r][c];
            if (block.chainEligible) chainActive = true;
            block.state = 'match'; block.timer = 40;
          });

          if (chainActive) this.chain++; else this.chain = 1;
          this.stopTimer = 50 + (matchedPositions.size * 10) + (this.chain * 10);
          this.score += matchedPositions.size * 10 * this.chain;

          if (this.onSendGarbage && (matchedPositions.size >= 4 || this.chain >= 2)) {
            let gw = Math.min(this.cols, 3 + (this.chain > 1 ? this.chain - 1 : 0));
            if (matchedPositions.size >= 4 && this.chain < 2) {
               gw = Math.min(this.cols, Math.max(3, matchedPositions.size - 1));
            }
            const gh = Math.max(1, this.chain - 1);
            this.onSendGarbage(gw, gh);
          }
        } else {
          let isMoving = false;
          for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
              const b = this.grid[r][c];
              if (b && (b.state === 'match' || b.state === 'fall' || b.state === 'hover')) isMoving = true;
            }
          }
          if (!isMoving) {
            this.chain = 0;
            for (let r = 0; r < this.rows; r++) {
              for (let c = 0; c < this.cols; c++) if (this.grid[r][c]) this.grid[r][c].chainEligible = false;
            }
          }
        }
      }
    }

    // --- 描画エンジン ---
    class BoardRenderer {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = COLS * CELL_PX;
        this.canvas.height = ROWS * CELL_PX + CELL_PX * 0.75; 
      }
      draw(engine) {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        const offsetY = engine.riseOffset * CELL_PX;

        for (let r = 0; r < engine.rows; r++) {
          for (let c = 0; c < engine.cols; c++) {
            const b = engine.grid[r][c];
            if (b) {
              const x = c * CELL_PX;
              const y = r * CELL_PX - offsetY + (b.fallY * CELL_PX);

              if (b.type === 'garbage') {
                ctx.fillStyle = '#5c636a'; ctx.fillRect(x, y, CELL_PX, CELL_PX);
                ctx.strokeStyle = '#dee2e6'; ctx.lineWidth = 2;
                
                const sameTop = r > 0 && engine.grid[r-1][c] && engine.grid[r-1][c].groupId === b.groupId;
                const sameBottom = r < engine.rows-1 && engine.grid[r+1][c] && engine.grid[r+1][c].groupId === b.groupId;
                const sameLeft = c > 0 && engine.grid[r][c-1] && engine.grid[r][c-1].groupId === b.groupId;
                const sameRight = c < engine.cols-1 && engine.grid[r][c+1] && engine.grid[r][c+1].groupId === b.groupId;

                ctx.beginPath();
                if (!sameTop) { ctx.moveTo(x, y+1); ctx.lineTo(x+CELL_PX, y+1); }
                if (!sameBottom) { ctx.moveTo(x, y+CELL_PX-1); ctx.lineTo(x+CELL_PX, y+CELL_PX-1); }
                if (!sameLeft) { ctx.moveTo(x+1, y); ctx.lineTo(x+1, y+CELL_PX); }
                if (!sameRight) { ctx.moveTo(x+CELL_PX-1, y); ctx.lineTo(x+CELL_PX-1, y+CELL_PX); }
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.beginPath(); ctx.arc(x+CELL_PX/2, y+CELL_PX/2, CELL_PX/4, 0, Math.PI*2); ctx.fill();
              } else {
                const conf = COLORS.find(item => item.id === b.type);
                if (conf) {
                  ctx.fillStyle = (b.state === 'match' && Math.floor(b.timer/4)%2 === 0) ? '#fff' : conf.bg;
                  ctx.beginPath(); ctx.roundRect(x+2, y+2, CELL_PX-4, CELL_PX-4, 8); ctx.fill();
                  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(conf.symbol, x+CELL_PX/2, y+CELL_PX/2);
                }
              }
            }
          }
        }

        for (let c = 0; c < engine.cols; c++) {
          const b = engine.nextRow[c];
          if (b) {
            const x = c * CELL_PX;
            const y = engine.rows * CELL_PX - offsetY;
            const conf = COLORS.find(item => item.id === b.type);
            if (conf) {
              ctx.globalAlpha = 0.35; 
              ctx.fillStyle = conf.bg;
              ctx.beginPath(); ctx.roundRect(x+2, y+2, CELL_PX-4, CELL_PX-4, 8); ctx.fill();
              ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(conf.symbol, x+CELL_PX/2, y+CELL_PX/2);
              ctx.globalAlpha = 1.0;  
            }
          }
        }

        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
        ctx.strokeRect(engine.cursor.x * CELL_PX - 2, engine.cursor.y * CELL_PX - offsetY - 2, CELL_PX * 2 + 4, CELL_PX + 4);

        if (engine.gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          ctx.fillStyle = '#ff3366'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GAME OVER', this.canvas.width/2, this.canvas.height/2);
        }
      }
    }

    // --- COM(AI) エンジン ---
    class ComAI {
      constructor(engine, level) {
        this.engine = engine; this.level = level;
        this.target = null;
        this.thinkInterval = [50, 35, 20, 5][level - 1]; 
        this.moveInterval = [15, 10, 5, 2][level - 1];   
        this.actionTimer = this.thinkInterval;
        this.moveTimer = 0;
        this.engine.riseSpeed = 0.0006 + (level * 0.0002); 
      }
      update() {
        if (this.engine.gameOver) return;
        
        let maxH = 0;
        for (let c=0; c<COLS; c++) { 
          for (let r=0; r<ROWS; r++) { 
            if (this.engine.grid[r][c]) { maxH = Math.max(maxH, ROWS-r); break; } 
          } 
        }
        if (maxH >= 6) this.engine.isRisingManualPad = false; 

        if (this.target) {
          this.moveTimer--;
          if (this.moveTimer <= 0) {
            this.moveTimer = this.moveInterval;
            let moved = false;
            if (this.engine.cursor.x < this.target.x) { this.engine.cursor.x++; moved = true; }
            else if (this.engine.cursor.x > this.target.x) { this.engine.cursor.x--; moved = true; }
            else if (this.engine.cursor.y < this.target.y) { this.engine.cursor.y++; moved = true; }
            else if (this.engine.cursor.y > this.target.y) { this.engine.cursor.y--; moved = true; }
            if (!moved) { this.engine.swap(this.engine.cursor.x, this.engine.cursor.y); this.target = null; this.actionTimer = this.thinkInterval; }
          }
        } else {
          this.actionTimer--;
          if (this.actionTimer <= 0) this.think();
        }
      }
      think() {
        this.actionTimer = this.thinkInterval;
        this.engine.isRisingManualPad = false;

        let maxH = 0;
        for (let c=0; c<COLS; c++) { 
          for (let r=0; r<ROWS; r++) { 
            if (this.engine.grid[r][c]) { maxH = Math.max(maxH, ROWS-r); break; } 
          } 
        }

        let bestMoves = [];
        for (let r=0; r<ROWS; r++) {
          for (let c=0; c<COLS-1; c++) {
            if (this.canSwapAndMatch(r, c)) bestMoves.push({x:c, y:r});
          }
        }

        if (bestMoves.length > 0) {
          this.target = bestMoves[Math.floor(Math.random() * bestMoves.length)];
          this.moveTimer = this.moveInterval;
        } else {
          if (this.level >= 3 && maxH <= 5 && this.engine.garbageQueue.length === 0) {
            this.engine.isRisingManualPad = true;
          } else { 
            this.engine.isRisingManualPad = false;
            this.target = { x: Math.floor(Math.random()*(COLS-1)), y: Math.floor(Math.random()*(ROWS-2))+2 }; 
            this.moveTimer = this.moveInterval; 
          }
        }
      }
      canSwapAndMatch(r, c) {
        const b1 = this.engine.grid[r][c], b2 = this.engine.grid[r][c+1];
        if (b1 && b1.state !== 'normal') return false;
        if (b2 && b2.state !== 'normal') return false;
        if (!b1 && !b2) return false;
        if (b1 && b2 && b1.type === b2.type) return false;
        const temp = this.engine.grid.map(row => row.map(cell => cell ? {...cell} : null));
        let t = temp[r][c]; temp[r][c] = temp[r][c+1]; temp[r][c+1] = t;
        for (let rr=0; rr<ROWS; rr++) {
          for (let cc=0; cc<COLS-2; cc++) {
            if (temp[rr][cc] && temp[rr][cc].type!=='garbage' && temp[rr][cc+1] && temp[rr][cc+2] && temp[rr][cc].type===temp[rr][cc+1].type && temp[rr][cc].type===temp[rr][cc+2].type) return true;
          }
        }
        for (let cc=0; cc<COLS; cc++) {
          for (let rr=0; rr<ROWS-2; rr++) {
            if (temp[rr][cc] && temp[rr][cc].type!=='garbage' && temp[rr+1][cc] && temp[rr+2][cc] && temp[rr][cc].type===temp[rr+1][cc].type && temp[rr][cc].type===temp[rr+2][cc].type) return true;
          }
        }
        return false;
      }
    }

    // --- システム管理 ---
    let myEngine, rivalEngine, myRenderer, rivalRenderer, comAI = null;
    let peer = null, conn = null;
    let currentMode = 'single', currentComLevel = 1;
    let rematchReady = { me: false, rival: false };
    let isMatchOver = false;
    let loopId = null, syncIntervalId = null;

    function showToast(msg) { 
      const t = document.getElementById('toast'); 
      t.innerText = msg; t.style.display = 'block'; 
      setTimeout(() => t.style.display = 'none', 3000); 
    }
    function showComMenu() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('com-menu').style.display = 'flex'; }
    function backToMainMenu() { document.getElementById('com-menu').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'; }

    function showResultModal(titleMsg) {
      document.getElementById('result-title').innerText = titleMsg;
      document.getElementById('result-status').innerText = '';
      const btn = document.getElementById('result-rematch-btn');
      btn.style.display = 'inline-block';
      btn.disabled = false;
      btn.innerText = 'もう一度対戦する';
      document.getElementById('result-overlay').style.display = 'flex';
    }

    function requestRematch() {
      if (currentMode === 'single' || currentMode === 'com') {
        resetGameLogic();
        document.getElementById('result-overlay').style.display = 'none';
      } else if (currentMode.startsWith('online')) {
        rematchReady.me = true;
        if (conn && conn.open) conn.send({ type: 'rematch_req' });
        
        if (rematchReady.rival) {
          resetGameLogic();
          document.getElementById('result-overlay').style.display = 'none';
        } else {
          const btn = document.getElementById('result-rematch-btn');
          btn.disabled = true;
          btn.innerText = '待機中...';
          document.getElementById('result-status').innerText = '相手の返答を待っています...';
        }
      }
    }

    function startGame(mode, level = 1) {
      currentMode = mode;
      currentComLevel = level;
      
      document.getElementById('menu-overlay').style.display = 'none';
      document.getElementById('game-area').style.display = 'flex';
      
      setupInput();
      resetGameLogic();
      adjustLayout();
      
      if (loopId) cancelAnimationFrame(loopId);
      loopId = requestAnimationFrame(gameLoop);
    }

    function resetGameLogic() {
      isMatchOver = false;
      const handicap = parseInt(document.getElementById('handicap-val').value) || 3;
      
      myRenderer = new BoardRenderer('my-canvas'); 
      rivalRenderer = new BoardRenderer('rival-canvas');
      
      myEngine = new PonEngine(
        (state) => { 
          if (state === 'gameover') {
            if (isMatchOver) return;
            isMatchOver = true;
            if (currentMode.startsWith('online')) {
              if (conn && conn.open) conn.send({ type: 'win' });
              showResultModal("LOSE...");
            } else if (currentMode === 'com') {
              showResultModal("LOSE...");
            } else {
              showResultModal("GAME OVER");
            }
          }
        },
        (w, h) => { 
          if (currentMode.startsWith('online') && conn && conn.open) conn.send({ type: 'garbage', w, h });
          else if (currentMode === 'com' && rivalEngine) rivalEngine.addGarbage(w, h);
        },
        handicap
      );
      
      if (currentMode === 'com') {
        rivalEngine = new PonEngine(
          (state) => { 
            if (state === 'gameover') {
              if (isMatchOver) return;
              isMatchOver = true;
              showResultModal("WIN!!"); 
              if (myEngine) myEngine.gameOver = true;
            }
          },
          (w, h) => { myEngine.addGarbage(w, h); },
          3 
        );
        comAI = new ComAI(rivalEngine, currentComLevel);
      } else if (currentMode.startsWith('online')) {
        rivalEngine = new PonEngine(null, null, 3);
      }
      
      rematchReady = { me: false, rival: false };
      updateGarbagePreview(myEngine, 'my-garbage-preview');
      if (rivalEngine) updateGarbagePreview(rivalEngine, 'rival-garbage-preview');
    }

    function startSingleGame() { 
      document.getElementById('rival-wrapper').style.display = 'none';
      startGame('single'); 
    }
    
    function startComGame(level) {
      document.getElementById('rival-wrapper').style.display = 'flex';
      startGame('com', level); 
    }

    function startOnlineGame(isGuest) {
      document.getElementById('rival-wrapper').style.display = 'flex';
      startGame(isGuest ? 'online_guest' : 'online_host');
      
      if (syncIntervalId) clearInterval(syncIntervalId);
      syncIntervalId = setInterval(() => {
        if (conn && conn.open && myEngine && !isMatchOver) {
          conn.send({ 
            type: 'sync', grid: myEngine.grid, nextRow: myEngine.nextRow, 
            riseOffset: myEngine.riseOffset, score: myEngine.score, 
            garbageQueue: myEngine.garbageQueue 
          });
        }
      }, 100);
      showToast(isGuest ? '接続完了！対戦開始！' : '相手が参加しました！対戦開始！');
    }

    function exitGame() {
      if (myEngine && !myEngine.gameOver && currentMode !== 'single') {
        if (!confirm("退出してメニューに戻りますか？\n（対戦時は負けになります）")) return;
        if (currentMode.startsWith('online') && conn && conn.open) conn.send({ type: 'surrender' });
      } else {
        if (currentMode.startsWith('online') && conn && conn.open) conn.send({ type: 'leave' });
      }
      
      isMatchOver = true;
      myEngine = null; rivalEngine = null; comAI = null;
      if (conn) { conn.close(); conn = null; }
      if (peer) { peer.destroy(); peer = null; }
      
      if (syncIntervalId) { clearInterval(syncIntervalId); syncIntervalId = null; }
      if (loopId) { cancelAnimationFrame(loopId); loopId = null; }

      document.getElementById('result-overlay').style.display = 'none';
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('rival-wrapper').style.display = 'none';
      document.getElementById('menu-overlay').style.display = 'flex';
      document.getElementById('main-menu').style.display = 'flex';
      document.getElementById('com-menu').style.display = 'none';
    }

    let padState = {}, prevPadState = {};
    function pollGamepadInput() {
      const pad = navigator.getGamepads()[0];
      if (!pad) {
        if (myEngine) myEngine.isRisingManualPad = false;
        return;
      }
      prevPadState = { ...padState };
      pad.buttons.forEach((b, i) => padState[i] = b.pressed);
      const justPressed = (btnIdx) => padState[btnIdx] && !prevPadState[btnIdx];

      if (!myEngine || myEngine.gameOver) return;

      if (padConfig.Up !== null && justPressed(padConfig.Up) && myEngine.cursor.y > 0) myEngine.cursor.y--;
      if (padConfig.Down !== null && justPressed(padConfig.Down) && myEngine.cursor.y < ROWS - 1) myEngine.cursor.y++;
      if (padConfig.Left !== null && justPressed(padConfig.Left) && myEngine.cursor.x > 0) myEngine.cursor.x--;
      if (padConfig.Right !== null && justPressed(padConfig.Right) && myEngine.cursor.x < COLS - 2) myEngine.cursor.x++;
      if (padConfig.Swap !== null && justPressed(padConfig.Swap)) myEngine.swap(myEngine.cursor.x, myEngine.cursor.y);
      if (padConfig.Rise !== null) myEngine.isRisingManualPad = padState[padConfig.Rise];
    }

    function updateGarbagePreview(engine, containerId) {
      const container = document.getElementById(containerId);
      if (!container || !engine) return;
      
      const qStr = JSON.stringify(engine.garbageQueue);
      if (container.dataset.qStr === qStr) return;
      container.dataset.qStr = qStr;

      container.innerHTML = '';
      engine.garbageQueue.forEach(g => {
        const block = document.createElement('div');
        block.style.backgroundColor = '#5c636a';
        block.style.border = '1px solid #dee2e6';
        block.style.borderRadius = '2px';
        block.style.width = `${Math.min(36, Math.max(12, g.w * 5))}px`;
        block.style.height = `${Math.min(18, Math.max(8, g.h * 4))}px`;
        block.style.flexShrink = '0';
        container.appendChild(block);
      });
    }

    function gameLoop() {
      pollGamepadInput();
      
      if (myEngine) {
        myEngine.update(); myRenderer.draw(myEngine);
        document.getElementById('score-label').innerText = `SCORE: ${myEngine.score} | CHAIN: ${myEngine.chain}`;
        updateGarbagePreview(myEngine, 'my-garbage-preview');
      }
      if (currentMode !== 'single' && rivalEngine) {
        if (comAI) comAI.update();
        rivalEngine.update(); rivalRenderer.draw(rivalEngine);
        document.getElementById('rival-score-label').innerText = `SCORE: ${rivalEngine.score}`;
        updateGarbagePreview(rivalEngine, 'rival-garbage-preview');
      }
      loopId = requestAnimationFrame(gameLoop);
    }

    let inputSetupDone = false;
    function setupInput() {
      if (inputSetupDone) return;
      inputSetupDone = true;

      const cvs = document.getElementById('my-canvas');
      let isDown = false, grabbedCol = -1, grabbedRow = -1, initialCanvasX = 0, initialCanvasY = 0;

      cvs.addEventListener('pointerdown', (e) => {
        isDown = true; cvs.setPointerCapture(e.pointerId);
        const rect = cvs.getBoundingClientRect();
        const scaleX = cvs.width / rect.width, scaleY = cvs.height / rect.height;
        initialCanvasX = (e.clientX - rect.left) * scaleX;
        initialCanvasY = (e.clientY - rect.top) * scaleY;
        grabbedCol = Math.max(0, Math.min(COLS - 1, Math.floor(initialCanvasX / CELL_PX)));
        grabbedRow = Math.max(0, Math.min(ROWS - 1, Math.floor((initialCanvasY + myEngine.riseOffset * CELL_PX) / CELL_PX)));
      });

      cvs.addEventListener('pointermove', (e) => {
        if (!isDown || !myEngine) return;
        const rect = cvs.getBoundingClientRect();
        const canvasX = (e.clientX - rect.left) * (cvs.width / rect.width);
        let targetCol = Math.max(0, Math.min(COLS - 1, Math.floor(canvasX / CELL_PX)));
        const continuous = document.getElementById('continuous-swipe').checked;

        while (targetCol > grabbedCol) {
           myEngine.cursor.x = grabbedCol; myEngine.cursor.y = grabbedRow;
           if (myEngine.swap(grabbedCol, grabbedRow)) {
              grabbedCol++;
              if (!continuous) { isDown = false; break; }
           } else break;
        }
        while (targetCol < grabbedCol) {
           myEngine.cursor.x = grabbedCol - 1; myEngine.cursor.y = grabbedRow;
           if (myEngine.swap(grabbedCol - 1, grabbedRow)) {
              grabbedCol--;
              if (!continuous) { isDown = false; break; }
           } else break;
        }
      });

      cvs.addEventListener('pointerup', (e) => {
        if (!isDown) return;
        isDown = false; cvs.releasePointerCapture(e.pointerId);
        const rect = cvs.getBoundingClientRect();
        const canvasX = (e.clientX - rect.left) * (cvs.width / rect.width);
        const canvasY = (e.clientY - rect.top) * (cvs.height / rect.height);
        
        if (Math.abs(canvasX - initialCanvasX) < CELL_PX * 0.3 && Math.abs(canvasY - initialCanvasY) < CELL_PX * 0.3) {
          let c = Math.floor(canvasX / CELL_PX);
          if (c >= COLS - 1) c = COLS - 2;
          if (myEngine) { myEngine.cursor.x = c; myEngine.cursor.y = grabbedRow; }
        }
      });
      cvs.addEventListener('pointercancel', () => { isDown = false; });

      const riseBtn = document.getElementById('rise-btn');
      riseBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); if(myEngine) myEngine.isRisingManualBtn = true; });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
        riseBtn.addEventListener(ev, () => { if(myEngine) myEngine.isRisingManualBtn = false; });
      });

      window.addEventListener('keydown', (e) => {
        if (assigningAction && assignType === 'key') {
          e.preventDefault();
          keyConfig[assigningAction] = e.code;
          assigningAction = null;
          renderConfigUI();
          return;
        }
        if (!myEngine || myEngine.gameOver) return;
        const code = e.code;
        if (code === keyConfig.Up) { e.preventDefault(); if (myEngine.cursor.y > 0) myEngine.cursor.y--; }
        if (code === keyConfig.Down) { e.preventDefault(); if (myEngine.cursor.y < ROWS - 1) myEngine.cursor.y++; }
        if (code === keyConfig.Left) { e.preventDefault(); if (myEngine.cursor.x > 0) myEngine.cursor.x--; }
        if (code === keyConfig.Right) { e.preventDefault(); if (myEngine.cursor.x < COLS - 2) myEngine.cursor.x++; }
        if (code === keyConfig.Swap) { e.preventDefault(); myEngine.swap(myEngine.cursor.x, myEngine.cursor.y); }
        if (code === keyConfig.Rise) { e.preventDefault(); myEngine.isRisingManualKey = true; }
      });

      window.addEventListener('keyup', (e) => {
        if (myEngine && e.code === keyConfig.Rise) myEngine.isRisingManualKey = false;
      });
    }

    // --- オンライン対戦 ---
    const PEER_PREFIX = 'pdw-26-';

    function generateShortRoomCode() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let res = '';
      for (let i = 0; i < 4; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
      return res;
    }

    function createRoom() {
      let code = document.getElementById('peer-room-id').value.trim();
      if (!code) {
        code = generateShortRoomCode();
        document.getElementById('peer-room-id').value = code;
      }
      const fullPeerId = PEER_PREFIX + code.toUpperCase();
      
      if (peer) { try { peer.destroy(); } catch(e){} }
      peer = new Peer(fullPeerId);

      peer.on('open', () => {
        document.getElementById('peer-info').innerHTML = `部屋コード: <b style="font-size:1.3rem; color:#ff007f;">${code.toUpperCase()}</b><br>相手にこのコードを伝えてください`;
        navigator.clipboard?.writeText(code.toUpperCase()); 
        showToast(`部屋コード [${code.toUpperCase()}] をコピーしました！待機中...`);
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          showToast('そのコードの部屋は既に存在します。別のコードを入力してください');
        } else {
          showToast('接続エラー: ' + err.type);
        }
      });

      peer.on('connection', (c) => { 
        conn = c; 
        bindConnEvents(); 
        startOnlineGame(false); 
      });
    }

    function joinRoom() {
      const code = document.getElementById('peer-room-id').value.trim();
      if (!code) { showToast('部屋コードを入力してください'); return; }
      const targetPeerId = PEER_PREFIX + code.toUpperCase();

      if (peer) { try { peer.destroy(); } catch(e){} }
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(targetPeerId);
        conn.on('open', () => { 
          bindConnEvents(); 
          startOnlineGame(true); 
        });
        conn.on('error', () => { showToast('部屋への接続に失敗しました'); });
      });

      peer.on('error', (err) => { showToast('接続エラー: ' + err.type); });
    }
    
    function bindConnEvents() {
      conn.on('data', (data) => {
        if (data.type === 'sync') {
          if (rivalEngine && !isMatchOver) {
            rivalEngine.grid = data.grid; rivalEngine.nextRow = data.nextRow; 
            rivalEngine.riseOffset = data.riseOffset; rivalEngine.score = data.score;
            if (data.garbageQueue) rivalEngine.garbageQueue = data.garbageQueue;
          }
        } else if (data.type === 'garbage') {
          if (myEngine) myEngine.addGarbage(data.w, data.h); 
          showToast('おじゃまブロックが飛んできた！');
        } else if (data.type === 'win') {
          if (!isMatchOver) {
            isMatchOver = true;
            showResultModal('WIN!!');
            if (myEngine) myEngine.gameOver = true;
            if (rivalEngine) rivalEngine.gameOver = true;
          }
        } else if (data.type === 'surrender') {
          if (!isMatchOver) {
            isMatchOver = true;
            showResultModal('WIN!! (相手が退出)');
            if (myEngine) myEngine.gameOver = true;
            if (rivalEngine) rivalEngine.gameOver = true;
            document.getElementById('result-rematch-btn').style.display = 'none';
          }
        } else if (data.type === 'rematch_req') {
          rematchReady.rival = true;
          if (rematchReady.me) {
            resetGameLogic();
            document.getElementById('result-overlay').style.display = 'none';
          } else {
            document.getElementById('result-status').innerText = '相手が再戦を希望しています！';
          }
        } else if (data.type === 'leave') {
          if (!isMatchOver) {
            isMatchOver = true;
            showResultModal('相手が退出しました');
          } else {
            document.getElementById('result-status').innerText = '相手が退出しました。';
          }
          if (myEngine) myEngine.gameOver = true;
          if (rivalEngine) rivalEngine.gameOver = true;
          document.getElementById('result-rematch-btn').style.display = 'none';
        }
      });

      conn.on('close', () => {
        if (!isMatchOver) {
          isMatchOver = true;
          showResultModal('通信が切断されました');
          if (myEngine) myEngine.gameOver = true;
          if (rivalEngine) rivalEngine.gameOver = true;
          document.getElementById('result-rematch-btn').style.display = 'none';
        }
      });
    }

    // --- 自動リサイズ・重なり防止レイアウト ---
    function adjustLayout() {
      const isPortrait = window.innerHeight > window.innerWidth;
      const W = window.innerWidth;
      const H = window.innerHeight;
      const isLeft = document.getElementById('handedness-toggle')?.checked;

      const myWrapper = document.getElementById('my-wrapper');
      const rivalWrapper = document.getElementById('rival-wrapper');
      const controls = document.getElementById('controls-container');
      const exitBtn = document.getElementById('exit-btn');
      const gameContainer = document.getElementById('game-container');

      controls.style.alignItems = 'center';

      if (isPortrait) {
        // 縦画面：コントロール列と自分の盤面を横並びに配置
        gameContainer.style.flexDirection = 'row';
        gameContainer.style.alignItems = 'center'; // ★画面の縦中央に配置
        gameContainer.style.justifyContent = 'center';
        gameContainer.style.paddingBottom = '0px'; 
        gameContainer.style.paddingTop = '0px';    

        // 相手盤面をコントロール列の最上部に移動
        if (rivalWrapper.parentNode !== controls) {
          controls.insertBefore(rivalWrapper, controls.firstChild);
        }

        // コントロール列の幅(110px)に合わせて相手盤面を縮小
        const rivalScale = 110 / 224; 
        const originalRivalH = 510; 
        const scaledRivalH = originalRivalH * rivalScale;
        
        rivalWrapper.style.transform = `scale(${rivalScale})`;
        rivalWrapper.style.transformOrigin = 'top center';
        rivalWrapper.style.position = 'relative';
        rivalWrapper.style.top = '0';
        rivalWrapper.style.left = 'auto';
        rivalWrapper.style.right = 'auto';
        rivalWrapper.style.zIndex = '25';
        rivalWrapper.style.width = '224px';
        rivalWrapper.style.flexShrink = '0';
        
        // 縮小した分の高さをネガティブマージンで詰める
        rivalWrapper.style.marginBottom = `${scaledRivalH - originalRivalH}px`;
        
        // ★コントロール列の高さを自分の盤面と同じにし、上（相手盤面）と下（ボタン類）に分ける
        controls.style.height = '515px';
        controls.style.justifyContent = 'flex-start'; 
        
        // ★相手盤面より下の要素（利き手スイッチ）を一番下に押し込む
        const handednessToggle = document.getElementById('handedness-toggle').parentNode;
        handednessToggle.style.marginTop = 'auto';

        // 自分の盤面とコントロール全体のスケール計算
        const baseBoardH = 515; 
        const availH = H - 80; // 退出ボタン用の余白確保
        let myScale = Math.min(1.0, availH / baseBoardH);
        
        const contentW = 344; // 盤面(224) + コントロール(110) + 隙間(10)
        if (contentW * myScale > W - 10) {
          myScale = (W - 10) / contentW;
        }
        myScale = Math.max(0.4, myScale);
        
        myWrapper.style.transform = `scale(${myScale})`;
        controls.style.transform = `scale(${myScale})`;
        myWrapper.style.transformOrigin = 'center'; // ★スケール基準を中心にして画面中央を保つ
        controls.style.transformOrigin = 'center';

        // 縮小による余白詰め（ネガティブマージン）
        const boardMx = (224 - 224 * myScale) / -2;
        const ctrlMx = (110 - 110 * myScale) / -2;
        myWrapper.style.margin = `0 ${boardMx}px`;
        controls.style.margin = `0 ${ctrlMx}px`;
        
        controls.style.position = 'relative';
        controls.style.bottom = 'auto';
        controls.style.left = 'auto';
        controls.style.right = 'auto';
        controls.style.width = '110px';

        if (isLeft) {
          exitBtn.style.right = '12px';
          exitBtn.style.left = 'auto';
        } else {
          exitBtn.style.left = '12px';
          exitBtn.style.right = 'auto';
        }
      } else {
        // 横画面：独立した3列レイアウトへの復帰
        gameContainer.style.flexDirection = 'row';
        gameContainer.style.alignItems = 'center';
        gameContainer.style.justifyContent = 'center';
        gameContainer.style.paddingBottom = '10px';
        gameContainer.style.paddingTop = '10px';

        // 相手盤面を元の場所 (game-container直下) に戻す
        if (rivalWrapper.parentNode === controls) {
          gameContainer.appendChild(rivalWrapper);
        }

        rivalWrapper.style.transform = '';
        rivalWrapper.style.position = '';
        rivalWrapper.style.top = '';
        rivalWrapper.style.left = '';
        rivalWrapper.style.right = '';
        rivalWrapper.style.margin = '0';
        rivalWrapper.style.marginBottom = '0';
        rivalWrapper.style.zIndex = '10';
        rivalWrapper.style.width = '';
        rivalWrapper.style.flexShrink = '';

        myWrapper.style.transform = '';
        myWrapper.style.margin = '0';
        myWrapper.style.transformOrigin = 'center';

        // コントロール列の並び順と高さをリセット
        controls.style.height = '';
        controls.style.justifyContent = 'flex-end';
        const handednessToggle = document.getElementById('handedness-toggle').parentNode;
        handednessToggle.style.marginTop = '0';

        controls.style.transform = '';
        controls.style.margin = '0';
        controls.style.position = '';
        controls.style.width = '110px';
        controls.style.bottom = '';
        controls.style.left = '';
        controls.style.right = '';

        if (isLeft) {
          exitBtn.style.right = '15px';
          exitBtn.style.left = 'auto';
        } else {
          exitBtn.style.left = '15px';
          exitBtn.style.right = 'auto';
        }
      }
    }

    function toggleHandedness() {
      const isLeft = document.getElementById('handedness-toggle').checked;
      const gameArea = document.getElementById('game-area');
      const label = document.getElementById('handedness-text');
      if (isLeft) {
        gameArea.classList.remove('right-handed');
        gameArea.classList.add('left-handed');
        label.innerText = '左利きモード';
        localStorage.setItem('pdw_handedness', 'left');
      } else {
        gameArea.classList.remove('left-handed');
        gameArea.classList.add('right-handed');
        label.innerText = '右利きモード';
        localStorage.setItem('pdw_handedness', 'right');
      }
      adjustLayout();
    }
    
    window.addEventListener('resize', adjustLayout);
    window.addEventListener('orientationchange', () => setTimeout(adjustLayout, 100));

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('pdw_handedness') === 'left') {
        document.getElementById('handedness-toggle').checked = true;
      }
      toggleHandedness();
    });
  </script>
