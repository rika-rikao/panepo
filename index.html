<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>ぱねぽ - パネポン風対戦パズル</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root { --bg-color: #1a1a2e; }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: #fff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    
    .small-btn { background: #0f3460; color: #fff; border: 1px solid #4ecca3; padding: 6px 12px; font-size: 0.9rem; border-radius: 15px; cursor: pointer; }
    .small-btn:active { background: #e94560; }

    /* メニュー */
    #menu-overlay {
      position: absolute; inset: 0; background: rgba(10, 10, 25, 0.95); z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 20px;
    }
    .title {
      font-size: 2.2rem; font-weight: 900; background: linear-gradient(45deg, #ff007f, #00d4ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
    }
    .btn {
      background: #0f3460; color: #fff; border: 2px solid #e94560; padding: 12px 28px;
      font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; min-width: 240px;
    }
    .btn:active { transform: scale(0.95); background: #e94560; }
    .btn:disabled { background: #555; border-color: #777; cursor: not-allowed; transform: none; }
    .input-box { padding: 10px; border-radius: 20px; border: 2px solid #4ecca3; background: #162447; color: #fff; text-align: center; width: 240px; outline: none; }
    
    /* 設定画面 */
    #settings-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 300;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    .settings-box {
      background: #162447; padding: 20px; border-radius: 15px; border: 2px solid #4ecca3;
      width: 90%; max-width: 450px; max-height: 85vh; /* iOS対応のため余裕を持たせる */
      overflow-y: auto; display: block; /* Flexboxによるレイアウト崩れ防止 */
    }
    .settings-box > * { margin-bottom: 15px; }
    .settings-box > *:last-child { margin-bottom: 0; }

    .settings-section { border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
    .config-btn { background: #0f3460; border: 1px solid #4ecca3; color: white; border-radius: 5px; padding: 6px; cursor: pointer; font-size: 0.85rem; width: 110px; text-align: center; }
    .config-btn:active { background: #e94560; }

    /* ゲーム画面全体 */
    #game-area {
      display: none; width: 100vw; height: 100vh; position: relative;
      flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }

    #game-container {
      display: flex; flex-direction: row; gap: 10px; width: 100%; height: 100%; padding: 10px;
      align-items: center; justify-content: center; flex: 1; position: relative;
    }
    
    .board-wrapper {
      display: flex; flex-direction: column; align-items: center; z-index: 10;
      transition: transform 0.1s ease-out, border 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .board-header { font-size: 0.95rem; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; width: 100%; }
    .canvas-container { border: 4px solid #3282b8; border-bottom: none; border-radius: 6px 6px 0 0; background: #000; box-shadow: 0 0 15px rgba(0,0,0,0.8); overflow: hidden; touch-action: none; }
    
    /* ターゲット枠線とバッジ */
    .rival-board { cursor: pointer; border-radius: 8px; padding: 2px; }
    .rival-board.targeted .canvas-container { border-color: #ff007f !important; box-shadow: 0 0 18px #ff007f !important; }
    .target-badge {
      display: none; background: #ff007f; color: #fff; font-size: 0.7rem; font-weight: 900;
      padding: 1px 6px; border-radius: 10px; animation: pulse 0.8s infinite alternate;
    }
    .rival-board.targeted .target-badge { display: inline-block; }
    @keyframes pulse { from { transform: scale(0.95); opacity: 0.8; } to { transform: scale(1.1); opacity: 1; } }

    /* 予告エリア */
    .garbage-preview-box {
      height: 24px; width: 100%; margin-bottom: 4px; display: flex; gap: 4px; align-items: center;
      background: rgba(0,0,0,0.45); border-radius: 6px; padding: 2px 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15);
    }
    .preview-label { font-size: 0.7rem; color: #4ecca3; margin-right: 4px; font-weight: bold; }
    .preview-list { display: flex; gap: 4px; align-items: center; height: 100%; overflow: hidden; }

    .action-btn { background: linear-gradient(135deg, #e94560, #ff6b6b); border: none; color: #fff; font-weight: bold; padding: 12px; border-radius: 25px; width: 100%; cursor: pointer; }
    .action-btn:active { transform: scale(0.92); }
    .retire-btn { background: linear-gradient(135deg, #d90429, #ef233c); }
    
    .switch-wrapper { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: #4ecca3; }
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #e94560; }

    /* UI配置制御 (利き手モード) */
    .absolute-top { position: absolute; top: 12px; padding: 8px 16px; font-size: 0.85rem; width: auto; z-index: 100; font-weight: bold; border-radius: 20px; }
    .right-handed .absolute-top { left: 12px; right: auto; }
    .left-handed .absolute-top { right: 12px; left: auto; }

    #toast { position: absolute; top: 20px; background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 20px; border: 1px solid #4ecca3; display: none; z-index: 400; font-weight: bold; }
  </style>
</head>
<body>
  <div id="toast"></div>

  <!-- 設定画面 -->
  <div id="settings-overlay">
    <div class="settings-box">
      <h2 style="text-align: center; color: #4ecca3;">設定</h2>
      
      <div class="settings-section">
        <h3>🎵 音声設定</h3>
        <p style="font-size:0.8rem; color:#aaa; margin-bottom: 5px;">マイBGM（ファイルやフォルダを選択して再生）</p>
        <div style="display:flex; gap:10px; margin-bottom: 10px;">
          <label class="small-btn">ファイル選択<input type="file" id="bgm-file-input" multiple accept="audio/*, .mp3, .m4a, .aac, .wav, .ogg, .opus, .webm" style="display:none;"></label>
          <label class="small-btn">フォルダ選択<input type="file" id="bgm-dir-input" multiple webkitdirectory directory accept="audio/*, .mp3, .m4a, .aac, .wav, .ogg, .opus, .webm" style="display:none;"></label>
          <button class="small-btn" onclick="toggleBgmPlay()">再生 / 停止</button>
        </div>
        <div style="font-size: 0.9rem;">
          BGM音量: <span id="bgm-volume-val">50</span>%<br>
          <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.5" style="width:100%; margin-top:5px;">
        </div>
        <div style="font-size: 0.9rem; margin-top: 10px;">
          SE音量 (効果音): <span id="se-volume-val">50</span>%<br>
          <input type="range" id="se-volume" min="0" max="1" step="0.05" value="0.5" style="width:100%; margin-top:5px;">
        </div>
      </div>

      <div class="settings-section">
        <h3>🎮 キー・パッド設定</h3>
        <p style="font-size:0.8rem; color:#aaa; margin-bottom: 5px;">変更したい枠を押してから、キーやボタンを入力してください。</p>
        <div id="key-config-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>

      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="closeSettings()">設定を保存して閉じる</button>
    </div>
  </div>

  <!-- リザルト ＆ 再戦モーダル -->
  <div id="result-overlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.85); z-index:250; flex-direction:column; align-items:center; justify-content:center;">
    <div style="background:#162447; padding:30px; border-radius:15px; border:2px solid #e94560; text-align:center; min-width:300px;">
      <h2 id="result-title" style="color:#ff007f; margin-bottom:15px; font-size:2rem;"></h2>
      <div id="result-status" style="margin-bottom:20px; color:#4ecca3; font-size:1rem; height:20px;"></div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button class="btn" id="result-rematch-btn" onclick="requestRematch()">もう一度対戦する</button>
        <button class="btn retire-btn" onclick="exitGame()">タイトルへ戻る</button>
      </div>
    </div>
  </div>

  <!-- メニュー -->
  <div id="menu-overlay">
    <div id="main-menu" style="display:flex; flex-direction:column; gap:15px; align-items:center;">
      <h1 class="title">ぱねぽ</h1>
      
      <div style="font-size: 0.9rem; color: #4ecca3; display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
        <span>自分のハンデ(有利さ):</span>
        <select id="handicap-val" class="input-box" style="width: auto; padding: 5px; font-size: 0.85rem; border-radius: 10px;">
          <option value="1">1: 不利 (激ムズ)</option>
          <option value="2">2: やや不利</option>
          <option value="3" selected>3: 普通</option>
          <option value="4">4: やや有利</option>
          <option value="5">5: 有利 (やさしい)</option>
        </select>
      </div>

      <button class="btn" onclick="startSingleGame()">ひとりで練習</button>
      <button class="btn" onclick="showComMenu()">COMと対戦</button>
      <button class="btn" onclick="openSettings()" style="background:#1a4d3e; border-color:#4ecca3;">⚙️設定</button>
      
      <div style="border-top:1px solid rgba(255,255,255,0.2); width:100%; margin:5px 0;"></div>
      
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <input type="text" id="peer-room-id" class="input-box" placeholder="部屋コード (最大4人)" maxlength="10">
        <div style="display:flex; gap:10px;">
          <button class="btn" style="min-width:115px; padding:10px 16px; font-size:1rem;" onclick="createRoom()">部屋を作る</button>
          <button class="btn" style="min-width:115px; padding:10px 16px; font-size:1rem;" onclick="joinRoom()">部屋に入る</button>
        </div>
      </div>
      <div id="peer-info" style="font-size:0.9rem; color:#4ecca3; text-align:center; min-height:22px;"></div>
    </div>
    
    <div id="com-menu" style="display:none; flex-direction:column; gap:12px; align-items:center;">
      <h2 style="color:#4ecca3">CPU対戦設定</h2>
      <div style="font-size:0.9rem; color:#4ecca3; display:flex; align-items:center; gap:8px;">
        <span>対戦人数:</span>
        <select id="com-player-count" class="input-box" style="width: auto; padding: 5px; font-size: 0.85rem; border-radius: 10px;">
          <option value="2" selected>2人対戦 (1 vs 1)</option>
          <option value="3">3人対戦 (1 vs 2)</option>
          <option value="4">4人対戦 (1 vs 3)</option>
        </select>
      </div>
      <button class="btn" onclick="startComGame(1)">Level 1 (やさしい)</button>
      <button class="btn" onclick="startComGame(2)">Level 2 (ふつう)</button>
      <button class="btn" onclick="startComGame(3)">Level 3 (むずかしい)</button>
      <button class="btn" onclick="startComGame(4)">Level 4 (げきむず)</button>
      <button class="btn" style="background:#444; border-color:#888;" onclick="backToMainMenu()">戻る</button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-area" class="right-handed">
    <!-- 退出ボタン -->
    <button id="exit-btn" class="action-btn retire-btn absolute-top" onclick="exitGame()">退出 (リタイア)</button>

    <!-- 3人以上対戦時の上部ミニ盤面エリア（最大25vh） -->
    <div id="rivals-top-area" style="display:none;"></div>

    <div id="game-container">
      <div id="controls-container" style="display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; z-index: 20; width: 110px;">
        <label id="handedness-wrapper" class="switch-wrapper" style="background: rgba(0,0,0,0.85); padding: 6px 8px; border-radius: 10px; flex-direction: column; gap: 4px; border: 1px solid #4ecca3;">
          <input type="checkbox" id="handedness-toggle" onchange="toggleHandedness()"> <span id="handedness-text" style="font-size: 0.75rem;">右利きモード</span>
        </label>
        <label id="swipe-wrapper" class="switch-wrapper" style="background: rgba(0,0,0,0.65); padding: 6px 8px; border-radius: 10px; flex-direction: column; gap: 4px; border: 1px solid rgba(255,255,255,0.1);">
          <input type="checkbox" id="continuous-swipe" checked>連続移動
        </label>
        <button class="action-btn" id="rise-btn" style="height: 60px; font-size: 1.05rem; box-shadow: 0 4px #8a0c24;">せり上げ</button>
      </div>

      <div class="board-wrapper" id="my-wrapper">
        <div class="garbage-preview-box">
          <span class="preview-label">予告</span>
          <div id="my-garbage-preview" class="preview-list"></div>
        </div>
        <div class="board-header">
          <span id="player-label">YOU</span>
          <span id="score-label">SCORE: 0</span>
        </div>
        <div class="canvas-container"><canvas id="my-canvas"></canvas></div>
      </div>
      
      <!-- 横画面・通常時の相手盤面エリア -->
      <div id="rivals-area" style="display: none; gap: 10px; align-items: center; justify-content: center;"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW Register Error:', err));
    }

    const COLS = 6, ROWS = 12, CELL_PX = 36;
    
    const COLORS = [
      { id: 1, bg: '#ff3366', symbol: '♥' }, { id: 2, bg: '#ffd700', symbol: '★' },
      { id: 3, bg: '#00d4ff', symbol: '◆' }, { id: 4, bg: '#00e676', symbol: '♣' },
      { id: 5, bg: '#ff9100', symbol: '▲' }, { id: 6, bg: '#9d00ff', symbol: '●' },
      { id: 7, bg: '#ffffff', symbol: '！', isSpecial: true, textColor: '#000' }
    ];

    // ==========================================
    // SE & BGM 制御 (Web Audio API)
    // ==========================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    document.body.addEventListener('pointerdown', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }, { once: true });

    const SE = {
      files: {
        cursorMove: 'assets/se/cursor_move.m4a',
        falledBlock: 'assets/se/falled_block.m4a',
        garbageErase: 'assets/se/garbage_block_erase.m4a',
        normalErase: 'assets/se/nomal_block_erase.m4a',
      },
      buffers: {},
      volume: 0.5,
      async load() {
        for (const [key, path] of Object.entries(this.files)) {
          try {
            const response = await fetch(path);
            const arrayBuffer = await response.arrayBuffer();
            const decoded = await new Promise((resolve, reject) => {
              audioCtx.decodeAudioData(arrayBuffer, resolve, reject);
            });
            this.buffers[key] = decoded;
          } catch (e) {
            console.warn('SE Load Error:', key, e);
          }
        }
      },
      play(key) {
        if (!this.buffers[key]) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const source = audioCtx.createBufferSource();
        source.buffer = this.buffers[key];
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = this.volume;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
      }
    };
    SE.load();

    let bgmAudio = new Audio();
    bgmAudio.loop = false;
    let bgmPlaylist = [], currentBgmIndex = 0, isBgmPlaying = false, bgmNeedsPlay = false;

    const savedSeVol = localStorage.getItem('pdw_se_vol');
    if (savedSeVol !== null) SE.volume = parseFloat(savedSeVol);
    const savedBgmVol = localStorage.getItem('pdw_bgm_vol');
    if (savedBgmVol !== null) bgmAudio.volume = parseFloat(savedBgmVol);

    document.getElementById('se-volume').value = SE.volume;
    document.getElementById('se-volume-val').innerText = Math.floor(SE.volume * 100);
    document.getElementById('bgm-volume').value = bgmAudio.volume;
    document.getElementById('bgm-volume-val').innerText = Math.floor(bgmAudio.volume * 100);

    document.getElementById('se-volume').addEventListener('input', (e) => {
      SE.volume = parseFloat(e.target.value);
      document.getElementById('se-volume-val').innerText = Math.floor(SE.volume * 100);
      localStorage.setItem('pdw_se_vol', SE.volume);
    });
    document.getElementById('bgm-volume').addEventListener('input', (e) => {
      bgmAudio.volume = parseFloat(e.target.value);
      document.getElementById('bgm-volume-val').innerText = Math.floor(bgmAudio.volume * 100);
      localStorage.setItem('pdw_bgm_vol', bgmAudio.volume);
    });

    function handleBgmFiles(files) {
      const arr = Array.from(files).filter(f => f.type.startsWith('audio/'));
      if (arr.length > 0) {
        bgmPlaylist = arr;
        currentBgmIndex = 0;
        bgmAudio.src = URL.createObjectURL(bgmPlaylist[currentBgmIndex]);
        bgmNeedsPlay = true;
        showToast('BGMをセットしました。「設定を保存して閉じる」を押すと再生されます');
      }
    }
    document.getElementById('bgm-file-input').addEventListener('change', e => handleBgmFiles(e.target.files));
    document.getElementById('bgm-dir-input').addEventListener('change', e => handleBgmFiles(e.target.files));

    function toggleBgmPlay() {
      if (bgmPlaylist.length === 0) { showToast('先にBGMファイルを選択してください'); return; }
      if (isBgmPlaying) {
        bgmAudio.pause(); isBgmPlaying = false;
      } else {
        bgmAudio.play().then(() => { isBgmPlaying = true; bgmNeedsPlay = false; }).catch(() => showToast('再生エラー'));
      }
    }
    bgmAudio.addEventListener('ended', () => {
      currentBgmIndex = (currentBgmIndex + 1) % bgmPlaylist.length;
      if (bgmPlaylist.length > 0) {
        bgmAudio.src = URL.createObjectURL(bgmPlaylist[currentBgmIndex]);
        bgmAudio.play().catch(()=>{});
      }
    });

    // --- コンフィグ管理 ---
    let keyConfig = { Up: 'ArrowUp', Down: 'ArrowDown', Left: 'ArrowLeft', Right: 'ArrowRight', Swap: 'Space', Rise: 'ShiftLeft', Target: 'KeyE' };
    let padConfig = { Up: 12, Down: 13, Left: 14, Right: 15, Swap: 0, Rise: 5, Target: 4 };
    
    try {
      const sKey = localStorage.getItem('pdw_key'), sPad = localStorage.getItem('pdw_pad');
      if (sKey) keyConfig = { ...keyConfig, ...JSON.parse(sKey) };
      if (sPad) padConfig = { ...padConfig, ...JSON.parse(sPad) };
    } catch(e) {}

    let assigningAction = null, assignType = null;

    function openSettings() { 
      document.getElementById('settings-overlay').style.display = 'flex'; 
      renderConfigUI();
    }
    function closeSettings() { 
      document.getElementById('settings-overlay').style.display = 'none'; 
      assigningAction = null;
      localStorage.setItem('pdw_key', JSON.stringify(keyConfig));
      localStorage.setItem('pdw_pad', JSON.stringify(padConfig));

      if (bgmNeedsPlay && !isBgmPlaying) {
        bgmAudio.play().then(() => { isBgmPlaying = true; bgmNeedsPlay = false; }).catch(e => console.log(e));
      }
    }

    function renderConfigUI() {
      const list = document.getElementById('key-config-list');
      list.innerHTML = '';
      Object.keys(keyConfig).forEach(action => {
        const row = document.createElement('div');
        row.style.display = 'flex'; row.style.justifyContent = 'space-between'; row.style.alignItems = 'center';
        
        const lbl = document.createElement('span'); lbl.innerText = action; lbl.style.width = '50px'; lbl.style.fontSize = '0.9rem';
        
        const kBtn = document.createElement('button'); kBtn.className = 'config-btn';
        kBtn.innerText = `Key: ${keyConfig[action].replace('Arrow','').replace('Key','')}`;
        kBtn.onclick = () => { assigningAction = action; assignType = 'key'; kBtn.innerText = '押してください'; };
        
        const pBtn = document.createElement('button'); pBtn.className = 'config-btn';
        pBtn.innerText = `Pad: ${padConfig[action] !== null ? padConfig[action] : 'なし'}`;
        pBtn.onclick = () => { assigningAction = action; assignType = 'pad'; pBtn.innerText = '押してください'; };
        
        row.append(lbl, kBtn, pBtn);
        list.appendChild(row);
      });
    }

    setInterval(() => {
      if (assigningAction && assignType === 'pad') {
        const pad = navigator.getGamepads()[0];
        if (pad) {
          pad.buttons.forEach((b, i) => {
            if (b.pressed) {
              padConfig[assigningAction] = i;
              assigningAction = null;
              renderConfigUI();
            }
          });
        }
      }
    }, 1000 / 30);


    // ==========================================
    // ゲームエンジン
    // ==========================================
    class PonEngine {
      constructor(onStateChange, onSendGarbage, handicap = 3, isPlayer = true) {
        this.cols = COLS; this.rows = ROWS;
        this.handicap = handicap;
        this.isPlayer = isPlayer; 
        this.grid = Array.from({ length: this.rows }, () => Array(this.cols).fill(null));
        this.nextRow = []; 
        this.riseOffset = 0; 
        
        // 激ムズ(不利:1)だったスピードを基準(普通:3)に引き上げ、難易度に応じて調整
        this.riseSpeed = 0.0012 - (handicap - 3) * 0.0003;
        if (this.riseSpeed < 0.0003) this.riseSpeed = 0.0003;

        this.stopTimer = 0;
        this.dangerTimer = 180; // 天井到達時のゲームオーバー猶予(約3秒)
        this.score = 0; this.chain = 0;
        this.gameOver = false;
        this.cursor = { x: 2, y: 6 };
        this.garbageQueue = [];
        this.onStateChange = onStateChange;
        this.onSendGarbage = onSendGarbage;
        
        this.isRisingManualBtn = false;
        this.isRisingManualKey = false;
        this.isRisingManualPad = false;

        this.initGrid(5);
      }

      initGrid(initRows) {
        for (let r = this.rows - initRows; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) this.grid[r][c] = this.getRandomBlock(c, r);
        }
        this.nextRow = this.createNextRow();
      }

      pickWeightedColor(candidateConfigs) {
        let totalWeight = 0;
        candidateConfigs.forEach(conf => {
          totalWeight += conf.isSpecial ? 1 : 4;
        });
        let rnd = Math.random() * totalWeight;
        for (const conf of candidateConfigs) {
          const w = conf.isSpecial ? 1 : 4;
          if (rnd < w) return conf.id;
          rnd -= w;
        }
        return candidateConfigs[0].id;
      }

      getRandomBlock(c, r, avoidMatch = true) {
        let validConfigs = [...COLORS];
        if (avoidMatch) {
          if (c >= 2 && this.grid[r] && this.grid[r][c-1] && this.grid[r][c-2] && this.grid[r][c-1].type === this.grid[r][c-2].type) {
            validConfigs = validConfigs.filter(conf => conf.id !== this.grid[r][c-1].type);
          }
          if (r <= this.rows - 3 && this.grid[r+1] && this.grid[r+2] && this.grid[r+1][c] && this.grid[r+2][c] && this.grid[r+1][c].type === this.grid[r+2][c].type) {
            validConfigs = validConfigs.filter(conf => conf.id !== this.grid[r+1][c].type);
          }
        }
        return { type: this.pickWeightedColor(validConfigs), state: 'normal', timer: 0, fallY: 0, chainEligible: false };
      }

      createNextRow() {
        const row = [];
        for (let c = 0; c < this.cols; c++) {
          let choices = [...COLORS];
          if (c >= 2 && row[c-1].type === row[c-2].type) {
            choices = choices.filter(conf => conf.id !== row[c-1].type);
          }
          row.push({ type: this.pickWeightedColor(choices), state: 'normal', timer: 0, fallY: 0, chainEligible: false });
        }
        return row;
      }

      swap(c, r) {
        if (this.gameOver || isMatchOver) return false;
        if (c < 0 || c >= this.cols - 1 || r < 0 || r >= this.rows) return false;
        const b1 = this.grid[r][c], b2 = this.grid[r][c + 1];
        
        const isFloating = (b, c_idx) => b && r < this.rows - 1 && this.grid[r+1][c_idx] === null;

        if (b1 && (b1.state !== 'normal' && b1.state !== 'transforming_wait')) return false;
        if (b2 && (b2.state !== 'normal' && b2.state !== 'transforming_wait')) return false;
        if (b1 && b1.type === 'garbage') return false;
        if (b2 && b2.type === 'garbage') return false;
        if (isFloating(b1, c) || isFloating(b2, c + 1)) return false;

        this.grid[r][c] = b2; this.grid[r][c + 1] = b1;

        if (this.grid[r][c]) this.grid[r][c].chainEligible = false;
        if (this.grid[r][c+1]) this.grid[r][c+1].chainEligible = false;

        if (this.grid[r][c] && r+1 < this.rows && this.grid[r+1][c] === null) { this.grid[r][c].state = 'hover'; this.grid[r][c].timer = 12; }
        if (this.grid[r][c+1] && r+1 < this.rows && this.grid[r+1][c+1] === null) { this.grid[r][c+1].state = 'hover'; this.grid[r][c+1].timer = 12; }

        this.checkMatches();
        return true;
      }

      manualRiseStep() {
        if (this.gameOver || isMatchOver) return;
        this.stopTimer = 0; 
        this.riseOffset += 0.035; 
        if (this.riseOffset >= 1.0) this.pushNewRow();
      }

      pushNewRow() {
        this.riseOffset = 0;
        // 即死判定を削除し、update内のdangerTimerで制御
        for (let r = 0; r < this.rows - 1; r++) this.grid[r] = this.grid[r + 1];
        this.grid[this.rows - 1] = this.nextRow;
        this.nextRow = this.createNextRow();
        this.checkMatches(); 
      }

      addGarbage(w, h, isHard = false) { 
        let adjustedH = h;
        if (this.handicap === 1) adjustedH = Math.floor(h * 1.5);
        else if (this.handicap === 2) adjustedH = Math.floor(h * 1.25);
        else if (this.handicap === 4) adjustedH = Math.ceil(h * 0.75);
        else if (this.handicap === 5) adjustedH = Math.ceil(h * 0.5);
        
        if (adjustedH < 1) adjustedH = 1;
        this.garbageQueue.push({ w, h: adjustedH, delay: 150, isHard }); 
      }

      spawnGarbage(g) {
        const groupId = Date.now() + Math.random();
        const startCol = g.startCol;
        for (let r = 0; r < g.h; r++) {
          for (let c = 0; c < g.w; c++) {
            const actualCol = startCol + c;
            this.grid[r][actualCol] = { type: 'garbage', state: 'fall', fallY: 0, timer: 0, groupId: groupId, isHard: g.isHard };
          }
        }
      }

      transformGarbageNear(r, c) {
        let triggeredGroupIds = new Set();
        
        [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr, nc]) => {
          if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
            const b = this.grid[nr][nc];
            if (b && b.type === 'garbage' && b.groupId) triggeredGroupIds.add(b.groupId);
          }
        });

        if (triggeredGroupIds.size > 0) {
          let newlyAdded = true;
          while (newlyAdded) {
            newlyAdded = false;
            for (let rr = 0; rr < this.rows; rr++) {
              for (let cc = 0; cc < this.cols; cc++) {
                const b = this.grid[rr][cc];
                if (b && b.type === 'garbage' && triggeredGroupIds.has(b.groupId)) {
                  [[rr-1,cc],[rr+1,cc],[rr,cc-1],[rr,cc+1]].forEach(([nr, nc]) => {
                    if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
                      const adjB = this.grid[nr][nc];
                      if (adjB && adjB.type === 'garbage' && adjB.groupId && adjB.groupId !== b.groupId) {
                        if (!triggeredGroupIds.has(adjB.groupId)) {
                          triggeredGroupIds.add(adjB.groupId);
                          newlyAdded = true;
                        }
                      }
                    }
                  });
                }
              }
            }
          }

          triggeredGroupIds.forEach(groupId => {
            let cells = [];
            for (let rr = 0; rr < this.rows; rr++) {
              for (let cc = 0; cc < this.cols; cc++) {
                const b = this.grid[rr][cc];
                if (b && b.type === 'garbage' && b.groupId === groupId) {
                  cells.push({r: rr, c: cc, b: b});
                }
              }
            }
            if (cells.length === 0) return;

            let isHardGroup = cells.some(item => item.b.isHard);
            let maxR = Math.max(...cells.map(item => item.r));
            
            let targetCells = [];
            if (isHardGroup) {
              targetCells = cells; // 全体を柔らかくする
            } else {
              targetCells = cells.filter(item => item.r === maxR); // 最下段のみ通常ブロック化
            }

            // 右から左（同列なら下から上）へソートしてアニメーションの順番をつける
            targetCells.sort((a, b) => {
              if (b.c !== a.c) return b.c - a.c;
              return b.r - a.r;
            });

            targetCells.forEach((item, idx) => {
              item.b.state = 'transforming';
              item.b.transformDelay = idx * 6; // 6フレームごとに変換
              item.b.transformToNormal = !isHardGroup;
            });

            cells.forEach(item => {
              if (item.b.state !== 'transforming') {
                item.b.state = 'transforming_wait';
              }
            });
          });
        }
      }

      update() {
        if (this.gameOver || isMatchOver) return;

        let needsMatchCheck = false;
        let isMoving = false;
        
        // 変換アニメーションと待機中の管理
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const b = this.grid[r][c];
            if (b && b.type === 'garbage' && b.state === 'transforming') {
              isMoving = true;
              if (b.transformDelay > 0) b.transformDelay--;
              if (b.transformDelay <= 0) {
                if (b.transformToNormal) {
                  const validConfigs = COLORS.filter(col => !col.isSpecial);
                  b.type = validConfigs[Math.floor(Math.random() * validConfigs.length)].id;
                  b.state = 'hover';
                  b.timer = 15;
                  b.chainEligible = true;
                  delete b.groupId;
                  delete b.isHard;
                } else {
                  b.isHard = false;
                  b.state = 'normal';
                }
                SE.play('garbageErase');
              }
            } else if (b && b.type === 'garbage' && b.state === 'transforming_wait') {
              isMoving = true;
            }
          }
        }

        // 天井チェックとスポーンチェック
        let isTopFilled = false;
        for (let c = 0; c < this.cols; c++) {
          if (this.grid[0][c] !== null) { isTopFilled = true; break; }
        }

        let garbageBlocked = false;
        if (!isMoving && this.garbageQueue.length > 0) {
          if (this.garbageQueue[0].delay > 0) {
            this.garbageQueue[0].delay--;
          } else {
            const g = this.garbageQueue[0];
            if (g.startCol === undefined) g.startCol = Math.floor(Math.random() * (this.cols - g.w + 1));
            let canSpawn = true;
            for (let r = 0; r < g.h; r++) {
              for (let c = 0; c < g.w; c++) {
                if (this.grid[r][g.startCol + c] !== null) { canSpawn = false; break; }
              }
              if (!canSpawn) break;
            }
            if (canSpawn) {
              this.spawnGarbage(g);
              this.garbageQueue.shift();
            } else {
              garbageBlocked = true;
            }
          }
        }

        // 天井またはお邪魔の詰まりがある場合は猶予タイマーを減らす
        if (isTopFilled || garbageBlocked) {
          if (!isMoving) {
            this.dangerTimer--;
            if (this.dangerTimer <= 0) {
              this.gameOver = true;
              if (this.onStateChange) this.onStateChange('gameover');
              return;
            }
          }
        } else {
          this.dangerTimer = 180;
        }

        // せり上がり処理（詰まっている時は上がらない）
        if (!isTopFilled && !garbageBlocked) {
          if (this.isRisingManualBtn || this.isRisingManualKey || this.isRisingManualPad) {
            this.manualRiseStep();
          } else {
            if (this.stopTimer > 0) this.stopTimer--;
            else {
              this.riseOffset += this.riseSpeed;
              if (this.riseOffset >= 1.0) this.pushNewRow();
            }
          }
        }

        // マッチングと落下の処理
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const b = this.grid[r][c];
            if (b && b.state === 'match') {
              isMoving = true; b.timer--;
              if (b.timer <= 0) {
                this.transformGarbageNear(r, c);
                this.grid[r][c] = null;
                
                for (let ur = r - 1; ur >= 0; ur--) {
                  const ub = this.grid[ur][c];
                  if (ub && ub.type !== 'garbage' && ub.state !== 'match') {
                    ub.state = 'hover';
                    ub.timer = 15;
                    ub.chainEligible = true;
                  } else {
                    break;
                  }
                }
                needsMatchCheck = true;
              }
            }
          }
        }

        const garbageGroups = new Map();
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const b = this.grid[r][c];
            if (b && b.type === 'garbage' && b.groupId) {
              if (!garbageGroups.has(b.groupId)) garbageGroups.set(b.groupId, []);
              garbageGroups.get(b.groupId).push({ r, c, block: b });
            }
          }
        }

        garbageGroups.forEach((cells, groupId) => {
          const hasTransforming = cells.some(item => item.block.state === 'transforming');
          if (!hasTransforming) {
            cells.forEach(item => {
              if (item.block.state === 'transforming_wait') {
                item.block.state = 'hover';
                item.block.timer = 10;
              }
            });
          }

          const leader = cells[0].block;
          if (leader.state === 'transforming' || leader.state === 'transforming_wait') return;

          if (leader.state === 'hover') {
            isMoving = true;
            leader.timer--;
            cells.forEach(item => item.block.timer = leader.timer);
            if (leader.timer <= 0) {
              cells.forEach(item => { item.block.state = 'fall'; item.block.fallY = 0; });
            }
          }

          if (leader.state === 'fall') {
            isMoving = true;
            let canFall = true;
            for (const item of cells) {
              if (item.r + 1 >= this.rows) { canFall = false; break; }
              const below = this.grid[item.r + 1][item.c];
              if (below !== null && below.groupId !== groupId) { canFall = false; break; }
            }

            if (!canFall) {
              cells.forEach(item => {
                item.block.state = 'normal';
                item.block.fallY = 0;
              });
              needsMatchCheck = true;
            } else {
              leader.fallY += 0.35;
              cells.forEach(item => item.block.fallY = leader.fallY);
              if (leader.fallY >= 1.0) {
                cells.sort((a, b) => b.r - a.r);
                for (const item of cells) {
                  this.grid[item.r + 1][item.c] = item.block;
                  this.grid[item.r][item.c] = null;
                  item.block.fallY = 0;
                  item.r += 1;
                }
                leader.fallY = 0;
                let hitBottom = false;
                for (const item of cells) {
                  if (item.r + 1 >= this.rows || (this.grid[item.r + 1][item.c] !== null && this.grid[item.r + 1][item.c].groupId !== groupId)) {
                    hitBottom = true; break;
                  }
                }
                if (hitBottom) {
                  cells.forEach(item => {
                    item.block.state = 'normal';
                    item.block.fallY = 0;
                  });
                  needsMatchCheck = true;
                  SE.play('falledBlock');
                }
              }
            }
          }

          if (leader.state === 'normal') {
            let supported = false;
            for (const item of cells) {
              if (item.r + 1 >= this.rows) { supported = true; break; }
              const below = this.grid[item.r + 1][item.c];
              if (below !== null && below.groupId !== groupId) { supported = true; break; }
            }
            if (!supported) {
              cells.forEach(item => {
                item.block.state = 'hover';
                item.block.timer = 10;
              });
            }
          }
        });

        // 通常ブロックのスタック落下処理
        for (let c = 0; c < this.cols; c++) {
          let r = this.rows - 1;
          while (r >= 0) {
            while (r >= 0 && (this.grid[r][c] === null || this.grid[r][c].type === 'garbage' || this.grid[r][c].state === 'match')) {
              r--;
            }
            if (r < 0) break;

            let canFallOrFloating = false;
            if (r + 1 < this.rows) {
              const below = this.grid[r + 1][c];
              if (below === null) canFallOrFloating = true;
            }

            if (canFallOrFloating || this.grid[r][c].state === 'hover' || this.grid[r][c].state === 'fall') {
              let stack = [];
              let cur = r;
              while (cur >= 0 && this.grid[cur][c] && this.grid[cur][c].type !== 'garbage' && this.grid[cur][c].state !== 'match') {
                stack.push({ r: cur, block: this.grid[cur][c] });
                cur--;
              }

              const leader = stack[0].block;
              const bottomR = stack[0].r;

              if (leader.state === 'normal') {
                leader.state = 'hover';
                leader.timer = 12;
              }

              for (const item of stack) item.block.state = leader.state;

              if (leader.state === 'hover') {
                isMoving = true;
                leader.timer--;
                for (const item of stack) item.block.timer = leader.timer;
                if (leader.timer <= 0) {
                  for (const item of stack) { item.block.state = 'fall'; item.block.fallY = 0; }
                }
              } else if (leader.state === 'fall') {
                isMoving = true;
                let blocked = false;
                if (bottomR + 1 >= this.rows) blocked = true;
                else {
                  const below = this.grid[bottomR + 1][c];
                  if (below !== null && below.state !== 'fall') blocked = true;
                }

                if (blocked) {
                  for (const item of stack) { item.block.state = 'normal'; item.block.fallY = 0; }
                  needsMatchCheck = true;
                } else {
                  leader.fallY += 0.35;
                  for (const item of stack) item.block.fallY = leader.fallY;
                  
                  if (leader.fallY >= 1.0) {
                    for (const item of stack) {
                      this.grid[item.r + 1][c] = item.block;
                      this.grid[item.r][c] = null;
                      item.block.fallY = 0;
                    }
                    if (bottomR + 2 >= this.rows || (this.grid[bottomR + 2][c] !== null && this.grid[bottomR + 2][c].state !== 'fall')) {
                      for (const item of stack) { item.block.state = 'normal'; item.block.fallY = 0; }
                      needsMatchCheck = true;
                    }
                  }
                }
              }
              r = cur;
            } else {
              this.grid[r][c].state = 'normal';
              this.grid[r][c].fallY = 0;
              r--;
            }
          }
        }

        if (needsMatchCheck) this.checkMatches();
      }

      checkMatches() {
        let matchedPositions = new Set();
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols - 2; c++) {
            const b1 = this.grid[r][c];
            if (!b1 || b1.state !== 'normal' || b1.type === 'garbage') continue;
            let matchCount = 1;
            for (let k = 1; c + k < this.cols; k++) {
              const b2 = this.grid[r][c+k];
              if (b2 && b2.state === 'normal' && b2.type === b1.type) matchCount++;
              else break;
            }
            if (matchCount >= 3) {
              for (let k = 0; k < matchCount; k++) matchedPositions.add(`${r},${c+k}`);
            }
          }
        }
        for (let c = 0; c < this.cols; c++) {
          for (let r = 0; r < this.rows - 2; r++) {
            const b1 = this.grid[r][c];
            if (!b1 || b1.state !== 'normal' || b1.type === 'garbage') continue;
            let matchCount = 1;
            for (let k = 1; r + k < this.rows; k++) {
              const b2 = this.grid[r+k][c];
              if (b2 && b2.state === 'normal' && b2.type === b1.type) matchCount++;
              else break;
            }
            if (matchCount >= 3) {
              for (let k = 0; k < matchCount; k++) matchedPositions.add(`${r+k},${c}`);
            }
          }
        }

        if (matchedPositions.size > 0) {
          SE.play('normalErase');

          let chainActive = false;
          let hasSpecial = false;

          matchedPositions.forEach(pos => {
            const [r, c] = pos.split(',').map(Number);
            const block = this.grid[r][c];
            if (block.chainEligible) chainActive = true;
            if (COLORS.find(col => col.id === block.type)?.isSpecial) hasSpecial = true;
            block.state = 'match'; block.timer = 40;
          });

          if (chainActive) this.chain++; else this.chain = 1;
          this.stopTimer = 50 + (matchedPositions.size * 10) + (this.chain * 10);
          this.score += matchedPositions.size * 10 * this.chain;

          let totalBlocks = 0;
          if (this.chain >= 2) {
            totalBlocks += (this.chain - 1) * 12;
          }
          if (matchedPositions.size >= 4) {
            totalBlocks += (matchedPositions.size - 3) * 6;
          }
          if (hasSpecial) {
            totalBlocks += 6;
          }

          if (totalBlocks > 0 && this.onSendGarbage) {
            this.onSendGarbage(totalBlocks, hasSpecial);
          }
        } else {
          let isMoving = false;
          for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
              const b = this.grid[r][c];
              if (b && (b.state === 'match' || b.state === 'fall' || b.state === 'hover' || b.state === 'transforming' || b.state === 'transforming_wait')) isMoving = true;
            }
          }
          if (!isMoving) {
            this.chain = 0;
            for (let r = 0; r < this.rows; r++) {
              for (let c = 0; c < this.cols; c++) if (this.grid[r][c]) this.grid[r][c].chainEligible = false;
            }
          }
        }
      }
    }

    // --- 描画エンジン ---
    class BoardRenderer {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = COLS * CELL_PX;
        this.canvas.height = ROWS * CELL_PX + CELL_PX * 0.75; 
      }
      draw(engine) {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        const offsetY = engine.riseOffset * CELL_PX;

        for (let r = 0; r < engine.rows; r++) {
          for (let c = 0; c < engine.cols; c++) {
            const b = engine.grid[r][c];
            if (b) {
              const x = c * CELL_PX;
              const y = r * CELL_PX - offsetY + (b.fallY * CELL_PX);

              if (b.type === 'garbage') {
                ctx.fillStyle = b.isHard ? '#a8b2bd' : '#5c636a'; 
                ctx.fillRect(x, y, CELL_PX, CELL_PX);
                ctx.strokeStyle = '#dee2e6'; ctx.lineWidth = 2;
                
                const sameTop = r > 0 && engine.grid[r-1][c] && engine.grid[r-1][c].groupId === b.groupId;
                const sameBottom = r < engine.rows-1 && engine.grid[r+1][c] && engine.grid[r+1][c].groupId === b.groupId;
                const sameLeft = c > 0 && engine.grid[r][c-1] && engine.grid[r][c-1].groupId === b.groupId;
                const sameRight = c < engine.cols-1 && engine.grid[r][c+1] && engine.grid[r][c+1].groupId === b.groupId;

                ctx.beginPath();
                if (!sameTop) { ctx.moveTo(x, y+1); ctx.lineTo(x+CELL_PX, y+1); }
                if (!sameBottom) { ctx.moveTo(x, y+CELL_PX-1); ctx.lineTo(x+CELL_PX, y+CELL_PX-1); }
                if (!sameLeft) { ctx.moveTo(x+1, y); ctx.lineTo(x+1, y+CELL_PX); }
                if (!sameRight) { ctx.moveTo(x+CELL_PX-1, y); ctx.lineTo(x+CELL_PX-1, y+CELL_PX); }
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.beginPath(); ctx.arc(x+CELL_PX/2, y+CELL_PX/2, CELL_PX/4, 0, Math.PI*2); ctx.fill();
              } else {
                const conf = COLORS.find(item => item.id === b.type);
                if (conf) {
                  const isFlashing = (b.state === 'match' && Math.floor(b.timer / 4) % 2 === 0);
                  ctx.fillStyle = isFlashing ? '#6c757d' : conf.bg;
                  ctx.beginPath(); ctx.roundRect(x+2, y+2, CELL_PX-4, CELL_PX-4, 8); ctx.fill();
                  
                  ctx.fillStyle = isFlashing ? '#ffffff' : (conf.textColor || '#fff'); 
                  ctx.font = 'bold 16px sans-serif'; 
                  ctx.textAlign = 'center'; 
                  ctx.textBaseline = 'middle'; 
                  ctx.fillText(conf.symbol, x+CELL_PX/2, y+CELL_PX/2);
                }
              }
            }
          }
        }

        for (let c = 0; c < engine.cols; c++) {
          const b = engine.nextRow[c];
          if (b) {
            const x = c * CELL_PX;
            const y = engine.rows * CELL_PX - offsetY;
            const conf = COLORS.find(item => item.id === b.type);
            if (conf) {
              ctx.globalAlpha = 0.35; 
              ctx.fillStyle = conf.bg;
              ctx.beginPath(); ctx.roundRect(x+2, y+2, CELL_PX-4, CELL_PX-4, 8); ctx.fill();
              ctx.fillStyle = conf.textColor || '#fff'; 
              ctx.font = 'bold 16px sans-serif'; 
              ctx.textAlign = 'center'; 
              ctx.textBaseline = 'middle'; 
              ctx.fillText(conf.symbol, x+CELL_PX/2, y+CELL_PX/2);
              ctx.globalAlpha = 1.0;  
            }
          }
        }

        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
        ctx.strokeRect(engine.cursor.x * CELL_PX - 2, engine.cursor.y * CELL_PX - offsetY - 2, CELL_PX * 2 + 4, CELL_PX + 4);

        if (engine.gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          ctx.fillStyle = '#ff3366'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GAME OVER', this.canvas.width/2, this.canvas.height/2);
        }
      }
    }

    // --- COM(AI) エンジン ---
    class ComAI {
      constructor(engine, level, id) {
        this.engine = engine; this.level = level; this.id = id;
        this.target = null;
        this.thinkInterval = [50, 35, 20, 5][level - 1]; 
        this.moveInterval = [15, 10, 5, 2][level - 1];   
        this.actionTimer = this.thinkInterval;
        this.moveTimer = 0;
        // プレイヤーのスピード変更に合わせる
        this.engine.riseSpeed = 0.0010 + (level * 0.0002); 
      }
      update() {
        if (this.engine.gameOver || isMatchOver) return;
        
        let maxH = 0;
        for (let c=0; c<COLS; c++) { 
          for (let r=0; r<ROWS; r++) { 
            if (this.engine.grid[r][c]) { maxH = Math.max(maxH, ROWS-r); break; } 
          } 
        }
        if (maxH >= 6) this.engine.isRisingManualPad = false; 

        if (this.target) {
          this.moveTimer--;
          if (this.moveTimer <= 0) {
            this.moveTimer = this.moveInterval;
            let moved = false;
            if (this.engine.cursor.x < this.target.x) { this.engine.cursor.x++; moved = true; }
            else if (this.engine.cursor.x > this.target.x) { this.engine.cursor.x--; moved = true; }
            else if (this.engine.cursor.y < this.target.y) { this.engine.cursor.y++; moved = true; }
            else if (this.engine.cursor.y > this.target.y) { this.engine.cursor.y--; moved = true; }
            if (!moved) { this.engine.swap(this.engine.cursor.x, this.engine.cursor.y); this.target = null; this.actionTimer = this.thinkInterval; }
          }
        } else {
          this.actionTimer--;
          if (this.actionTimer <= 0) this.think();
        }
      }
      think() {
        if (this.engine.gameOver || isMatchOver) return;
        this.actionTimer = this.thinkInterval;
        this.engine.isRisingManualPad = false;

        let maxH = 0;
        for (let c=0; c<COLS; c++) { 
          for (let r=0; r<ROWS; r++) { 
            if (this.engine.grid[r][c]) { maxH = Math.max(maxH, ROWS-r); break; } 
          } 
        }

        let bestMoves = [];
        for (let r=0; r<ROWS; r++) {
          for (let c=0; c<COLS-1; c++) {
            if (this.canSwapAndMatch(r, c)) bestMoves.push({x:c, y:r});
          }
        }

        if (bestMoves.length > 0) {
          this.target = bestMoves[Math.floor(Math.random() * bestMoves.length)];
          this.moveTimer = this.moveInterval;
        } else {
          if (this.level >= 3 && maxH <= 5 && this.engine.garbageQueue.length === 0) {
            this.engine.isRisingManualPad = true;
          } else { 
            this.engine.isRisingManualPad = false;
            this.target = { x: Math.floor(Math.random()*(COLS-1)), y: Math.floor(Math.random()*(ROWS-2))+2 }; 
            this.moveTimer = this.moveInterval; 
          }
        }
      }
      canSwapAndMatch(r, c) {
        const b1 = this.engine.grid[r][c], b2 = this.engine.grid[r][c+1];
        if (b1 && b1.state !== 'normal') return false;
        if (b2 && b2.state !== 'normal') return false;
        if (!b1 && !b2) return false;
        if (b1 && b2 && b1.type === b2.type) return false;
        const temp = this.engine.grid.map(row => row.map(cell => cell ? {...cell} : null));
        let t = temp[r][c]; temp[r][c] = temp[r][c+1]; temp[r][c+1] = t;
        for (let rr=0; rr<ROWS; rr++) {
          for (let cc=0; cc<COLS-2; cc++) {
            if (temp[rr][cc] && temp[rr][cc].type!=='garbage' && temp[rr][cc+1] && temp[rr][cc+2] && temp[rr][cc].type===temp[rr][cc+1].type && temp[rr][cc].type===temp[rr][cc+2].type) return true;
          }
        }
        for (let cc=0; cc<COLS; cc++) {
          for (let rr=0; rr<ROWS-2; rr++) {
            if (temp[rr][cc] && temp[rr][cc].type!=='garbage' && temp[rr+1][cc] && temp[rr+2][cc] && temp[rr][cc].type===temp[rr+1][cc].type && temp[rr][cc].type===temp[rr+2][cc].type) return true;
          }
        }
        return false;
      }
    }

    // ==========================================
    // 対戦・ターゲット管理システム
    // ==========================================
    let myEngine, myRenderer;
    let opponents = [];
    let myTargetIndex = -1;
    let peer = null, onlineConnections = [];
    let currentMode = 'single', currentComLevel = 1, currentTotalPlayers = 2;
    let rematchReady = { me: false };
    let isMatchOver = false;
    let loopId = null, syncIntervalId = null;

    function showToast(msg) { 
      const t = document.getElementById('toast'); 
      t.innerText = msg; t.style.display = 'block'; 
      setTimeout(() => t.style.display = 'none', 3000); 
    }
    function showComMenu() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('com-menu').style.display = 'flex'; }
    function backToMainMenu() { document.getElementById('com-menu').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'; }

    function selectTarget(index) {
      if (isMatchOver) return;
      if (myTargetIndex === index) {
        myTargetIndex = -1;
      } else {
        if (opponents[index] && !opponents[index].engine.gameOver) {
          myTargetIndex = index;
        }
      }
      updateTargetUI();
      SE.play('cursorMove');
    }

    function cycleTarget() {
      if (isMatchOver || opponents.length <= 0) return;
      let next = myTargetIndex + 1;
      while (next < opponents.length) {
        if (!opponents[next].engine.gameOver) {
          myTargetIndex = next;
          updateTargetUI();
          SE.play('cursorMove');
          return;
        }
        next++;
      }
      myTargetIndex = -1;
      updateTargetUI();
      SE.play('cursorMove');
    }

    function updateTargetUI() {
      opponents.forEach((opp, idx) => {
        const el = document.getElementById(`rival-wrapper-${idx}`);
        if (el) {
          if (idx === myTargetIndex && !opp.engine.gameOver) {
            el.classList.add('targeted');
          } else {
            el.classList.remove('targeted');
          }
        }
      });
    }

    function distributeGarbage(senderId, totalBlocks, isHard) {
      if (isMatchOver) return;

      let candidateOpponents = [];
      if (senderId === 'player') {
        candidateOpponents = opponents.filter(o => !o.engine.gameOver);
      } else {
        candidateOpponents = [];
        if (!myEngine.gameOver) candidateOpponents.push({ id: 'player', engine: myEngine });
        opponents.forEach(o => {
          if (o.id !== senderId && !o.engine.gameOver) candidateOpponents.push(o);
        });
      }

      if (candidateOpponents.length === 0) return;

      let targetOppId = null;
      if (senderId === 'player' && myTargetIndex !== -1 && opponents[myTargetIndex] && !opponents[myTargetIndex].engine.gameOver) {
        targetOppId = opponents[myTargetIndex].id;
      }

      const hasTarget = targetOppId !== null && candidateOpponents.some(o => o.id === targetOppId);

      if (hasTarget && candidateOpponents.length > 1) {
        const targetBlocks = Math.floor(totalBlocks * 0.5);
        const remainingBlocks = totalBlocks * 0.5;
        const othersCount = candidateOpponents.length - 1;
        const otherEachBlocks = Math.floor(remainingBlocks / othersCount);

        candidateOpponents.forEach(opp => {
          const count = (opp.id === targetOppId) ? targetBlocks : otherEachBlocks;
          if (count > 0) sendBlocksToOpponent(opp, count, isHard);
        });
      } else {
        const eachBlocks = Math.floor(totalBlocks / candidateOpponents.length);
        if (eachBlocks > 0) {
          candidateOpponents.forEach(opp => {
            sendBlocksToOpponent(opp, eachBlocks, isHard);
          });
        }
      }

      if (currentMode.startsWith('online') && senderId === 'player') {
        onlineConnections.forEach(c => {
          if (c && c.open) c.send({ type: 'distribute_garbage', totalBlocks, isHard, targetOppId });
        });
      }
    }

    function sendBlocksToOpponent(opp, count, isHard) {
      let fullRows = Math.floor(count / 6);
      let remainder = count % 6;
      if (fullRows > 0) opp.engine.addGarbage(6, fullRows, isHard);
      if (remainder >= 3) opp.engine.addGarbage(remainder, 1, isHard);
      else if (remainder > 0 && fullRows === 0) opp.engine.addGarbage(remainder, 1, isHard);
    }

    function showResultModal(titleMsg) {
      document.getElementById('result-title').innerText = titleMsg;
      document.getElementById('result-status').innerText = '';
      const btn = document.getElementById('result-rematch-btn');
      btn.style.display = 'inline-block';
      btn.disabled = false;
      btn.innerText = 'もう一度対戦する';
      document.getElementById('result-overlay').style.display = 'flex';
    }

    function requestRematch() {
      if (currentMode === 'single' || currentMode === 'com') {
        resetGameLogic();
        document.getElementById('result-overlay').style.display = 'none';
      } else if (currentMode.startsWith('online')) {
        rematchReady.me = true;
        onlineConnections.forEach(c => { if(c && c.open) c.send({ type: 'rematch_req' }); });
        resetGameLogic();
        document.getElementById('result-overlay').style.display = 'none';
      }
    }

    // ==========================================
    // 勝敗判定 ＆ 強制停止処理
    // ==========================================
    function checkMatchEnd() {
      if (isMatchOver) return;

      if (myEngine && myEngine.gameOver) {
        isMatchOver = true;
        stopAllEngines();
        showResultModal("LOSE...");
        return;
      }

      const aliveOpponents = opponents.filter(o => !o.engine.gameOver);
      if (opponents.length > 0 && aliveOpponents.length === 0) {
        isMatchOver = true;
        stopAllEngines();
        showResultModal("WIN!!");
      }
    }

    function stopAllEngines() {
      if (myEngine) {
        myEngine.isRisingManualBtn = false;
        myEngine.isRisingManualKey = false;
        myEngine.isRisingManualPad = false;
        myEngine.riseSpeed = 0;
      }
      opponents.forEach(opp => {
        if (opp.engine) {
          opp.engine.isRisingManualBtn = false;
          opp.engine.isRisingManualKey = false;
          opp.engine.isRisingManualPad = false;
          opp.engine.riseSpeed = 0;
          opp.engine.gameOver = true;
        }
        if (opp.ai) {
          opp.ai.target = null;
        }
      });
    }

    // --- ゲーム開始初期化 ---
    function startGame(mode, level = 1, totalPlayers = 2) {
      currentMode = mode;
      currentComLevel = level;
      currentTotalPlayers = totalPlayers;
      
      document.getElementById('menu-overlay').style.display = 'none';
      document.getElementById('game-area').style.display = 'flex';
      
      setupInput();
      resetGameLogic();
      
      if (loopId) cancelAnimationFrame(loopId);
      lastTime = performance.now();
      accumulator = 0;
      loopId = requestAnimationFrame(gameLoop);
    }

    function resetGameLogic() {
      isMatchOver = false;
      myTargetIndex = -1;
      const handicap = parseInt(document.getElementById('handicap-val').value) || 3;
      
      myRenderer = new BoardRenderer('my-canvas'); 
      myEngine = new PonEngine(
        (state) => { 
          if (state === 'gameover') {
            checkMatchEnd();
          }
        },
        (totalBlocks, isHard) => { 
          distributeGarbage('player', totalBlocks, isHard);
        },
        handicap,
        true
      );

      const rivalsArea = document.getElementById('rivals-area');
      const rivalsTopArea = document.getElementById('rivals-top-area');
      rivalsArea.innerHTML = '';
      rivalsTopArea.innerHTML = '';
      opponents = [];

      const opponentCount = currentMode === 'single' ? 0 : currentTotalPlayers - 1;

      for (let i = 0; i < opponentCount; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'board-wrapper rival-board';
        wrapper.id = `rival-wrapper-${i}`;
        wrapper.onclick = () => selectTarget(i);

        wrapper.innerHTML = `
          <div class="garbage-preview-box">
            <span class="preview-label">予告</span>
            <div id="rival-garbage-preview-${i}" class="preview-list"></div>
          </div>
          <div class="board-header">
            <span style="color: #e94560;">RIVAL ${i+1} <span class="target-badge">🎯 TARGET</span></span>
            <span id="rival-score-label-${i}">SCORE: 0</span>
          </div>
          <div class="canvas-container"><canvas id="rival-canvas-${i}"></canvas></div>
        `;
        rivalsArea.appendChild(wrapper);

        const oppId = `com_${i}`;
        const rRenderer = new BoardRenderer(`rival-canvas-${i}`);
        let rEngine = null, rAI = null;

        if (currentMode === 'com') {
          rEngine = new PonEngine(
            (state) => { if (state === 'gameover') checkMatchEnd(); },
            (totalBlocks, isHard) => { distributeGarbage(oppId, totalBlocks, isHard); },
            3,
            false
          );
          rAI = new ComAI(rEngine, currentComLevel, oppId);
        } else if (currentMode.startsWith('online')) {
          rEngine = new PonEngine(null, null, 3, false);
        }

        opponents.push({
          id: oppId,
          name: `RIVAL ${i+1}`,
          engine: rEngine,
          renderer: rRenderer,
          ai: rAI,
          index: i
        });
      }
      
      updateGarbagePreview(myEngine, 'my-garbage-preview');
      opponents.forEach((opp, i) => updateGarbagePreview(opp.engine, `rival-garbage-preview-${i}`));
      updateTargetUI();
      adjustLayout();
    }

    function startSingleGame() { 
      startGame('single', 1, 1); 
    }
    
    function startComGame(level) {
      const count = parseInt(document.getElementById('com-player-count').value) || 2;
      startGame('com', level, count); 
    }

    function startOnlineGame(totalCount = 2) {
      startGame('online', 1, totalCount);
      
      if (syncIntervalId) clearInterval(syncIntervalId);
      syncIntervalId = setInterval(() => {
        if (myEngine && !isMatchOver) {
          onlineConnections.forEach(c => {
            if (c && c.open) {
              c.send({ 
                type: 'sync', grid: myEngine.grid, nextRow: myEngine.nextRow, 
                riseOffset: myEngine.riseOffset, score: myEngine.score, 
                garbageQueue: myEngine.garbageQueue 
              });
            }
          });
        }
      }, 100);
    }

    function exitGame() {
      // isMatchOver(勝敗モーダル時)はアラートを出さない
      if (myEngine && !myEngine.gameOver && currentMode !== 'single' && !isMatchOver) {
        if (!confirm("退出してメニューに戻りますか？\n（対戦時は負けになります）")) return;
        onlineConnections.forEach(c => { if(c && c.open) c.send({ type: 'leave' }); });
      }
      
      isMatchOver = true;
      stopAllEngines();
      myEngine = null; opponents = [];
      onlineConnections.forEach(c => c.close());
      onlineConnections = [];
      if (peer) { peer.destroy(); peer = null; }
      
      if (syncIntervalId) { clearInterval(syncIntervalId); syncIntervalId = null; }
      if (loopId) { cancelAnimationFrame(loopId); loopId = null; }

      document.getElementById('result-overlay').style.display = 'none';
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('rivals-area').style.display = 'none';
      document.getElementById('rivals-top-area').style.display = 'none';
      document.getElementById('menu-overlay').style.display = 'flex';
      document.getElementById('main-menu').style.display = 'flex';
      document.getElementById('com-menu').style.display = 'none';
    }

    let padState = {}, prevPadState = {};
    function pollGamepadInput() {
      const pad = navigator.getGamepads()[0];
      if (!pad) {
        if (myEngine) myEngine.isRisingManualPad = false;
        return;
      }
      prevPadState = { ...padState };
      pad.buttons.forEach((b, i) => padState[i] = b.pressed);
      const justPressed = (btnIdx) => padState[btnIdx] && !prevPadState[btnIdx];

      if (!myEngine || myEngine.gameOver || isMatchOver) return;

      let moved = false;
      if (padConfig.Up !== null && justPressed(padConfig.Up) && myEngine.cursor.y > 0) { myEngine.cursor.y--; moved = true; }
      if (padConfig.Down !== null && justPressed(padConfig.Down) && myEngine.cursor.y < ROWS - 1) { myEngine.cursor.y++; moved = true; }
      if (padConfig.Left !== null && justPressed(padConfig.Left) && myEngine.cursor.x > 0) { myEngine.cursor.x--; moved = true; }
      if (padConfig.Right !== null && justPressed(padConfig.Right) && myEngine.cursor.x < COLS - 2) { myEngine.cursor.x++; moved = true; }
      
      if (moved) SE.play('cursorMove');
      if (padConfig.Swap !== null && justPressed(padConfig.Swap)) myEngine.swap(myEngine.cursor.x, myEngine.cursor.y);
      if (padConfig.Rise !== null) myEngine.isRisingManualPad = padState[padConfig.Rise];
      if (padConfig.Target !== null && justPressed(padConfig.Target)) cycleTarget();
    }

    function updateGarbagePreview(engine, containerId) {
      const container = document.getElementById(containerId);
      if (!container || !engine) return;
      
      const qStr = JSON.stringify(engine.garbageQueue);
      if (container.dataset.qStr === qStr) return;
      container.dataset.qStr = qStr;

      container.innerHTML = '';
      engine.garbageQueue.forEach(g => {
        const block = document.createElement('div');
        block.style.backgroundColor = g.isHard ? '#a8b2bd' : '#5c636a';
        block.style.border = '1px solid #dee2e6';
        block.style.borderRadius = '2px';
        block.style.width = `${Math.min(36, Math.max(12, g.w * 5))}px`;
        block.style.height = `${Math.min(18, Math.max(8, g.h * 4))}px`;
        block.style.flexShrink = '0';
        container.appendChild(block);
      });
    }

    let lastTime = 0, accumulator = 0;
    const FIXED_TIME_STEP = 1000 / 60;

    function gameLoop(time) {
      let deltaTime = time - lastTime;
      if (deltaTime > 100) deltaTime = 100;
      lastTime = time;
      accumulator += deltaTime;
      
      while (accumulator >= FIXED_TIME_STEP) {
        if (!isMatchOver) {
          pollGamepadInput();
          if (myEngine) myEngine.update();
          opponents.forEach(opp => {
            if (opp.ai) opp.ai.update();
            if (opp.engine) opp.engine.update();
          });
        }
        accumulator -= FIXED_TIME_STEP;
      }
      
      if (myEngine) {
        myRenderer.draw(myEngine);
        document.getElementById('score-label').innerText = `SCORE: ${myEngine.score} | CHAIN: ${myEngine.chain}`;
        updateGarbagePreview(myEngine, 'my-garbage-preview');
      }
      opponents.forEach((opp, i) => {
        if (opp.renderer && opp.engine) {
          opp.renderer.draw(opp.engine);
          const scoreEl = document.getElementById(`rival-score-label-${i}`);
          if (scoreEl) scoreEl.innerText = `SCORE: ${opp.engine.score}`;
          updateGarbagePreview(opp.engine, `rival-garbage-preview-${i}`);
        }
      });
      
      loopId = requestAnimationFrame(gameLoop);
    }

    let inputSetupDone = false;
    function setupInput() {
      if (inputSetupDone) return;
      inputSetupDone = true;

      const cvs = document.getElementById('my-canvas');
      let isDown = false, grabbedCol = -1, grabbedRow = -1, initialCanvasX = 0, initialCanvasY = 0;

      cvs.addEventListener('pointerdown', (e) => {
        if (isMatchOver) return;
        isDown = true; cvs.setPointerCapture(e.pointerId);
        const rect = cvs.getBoundingClientRect();
        const scaleX = cvs.width / rect.width, scaleY = cvs.height / rect.height;
        initialCanvasX = (e.clientX - rect.left) * scaleX;
        initialCanvasY = (e.clientY - rect.top) * scaleY;
        grabbedCol = Math.max(0, Math.min(COLS - 1, Math.floor(initialCanvasX / CELL_PX)));
        grabbedRow = Math.max(0, Math.min(ROWS - 1, Math.floor((initialCanvasY + myEngine.riseOffset * CELL_PX) / CELL_PX)));
      });

      cvs.addEventListener('pointermove', (e) => {
        if (!isDown || !myEngine || isMatchOver) return;
        const rect = cvs.getBoundingClientRect();
        const canvasX = (e.clientX - rect.left) * (cvs.width / rect.width);
        let targetCol = Math.max(0, Math.min(COLS - 1, Math.floor(canvasX / CELL_PX)));
        const continuous = document.getElementById('continuous-swipe').checked;

        while (targetCol > grabbedCol) {
           myEngine.cursor.x = grabbedCol; myEngine.cursor.y = grabbedRow;
           if (myEngine.swap(grabbedCol, grabbedRow)) {
              SE.play('cursorMove');
              grabbedCol++;
              if (!continuous) { isDown = false; break; }
           } else break;
        }
        while (targetCol < grabbedCol) {
           myEngine.cursor.x = grabbedCol - 1; myEngine.cursor.y = grabbedRow;
           if (myEngine.swap(grabbedCol - 1, grabbedRow)) {
              SE.play('cursorMove');
              grabbedCol--;
              if (!continuous) { isDown = false; break; }
           } else break;
        }
      });

      cvs.addEventListener('pointerup', (e) => {
        if (!isDown) return;
        isDown = false; cvs.releasePointerCapture(e.pointerId);
        if (isMatchOver) return;
        const rect = cvs.getBoundingClientRect();
        const canvasX = (e.clientX - rect.left) * (cvs.width / rect.width);
        const canvasY = (e.clientY - rect.top) * (cvs.height / rect.height);
        
        if (Math.abs(canvasX - initialCanvasX) < CELL_PX * 0.3 && Math.abs(canvasY - initialCanvasY) < CELL_PX * 0.3) {
          let c = Math.floor(canvasX / CELL_PX);
          if (c >= COLS - 1) c = COLS - 2;
          if (myEngine) {
            if (myEngine.cursor.x !== c || myEngine.cursor.y !== grabbedRow) {
              SE.play('cursorMove');
            }
            myEngine.cursor.x = c; 
            myEngine.cursor.y = grabbedRow; 
          }
        }
      });
      cvs.addEventListener('pointercancel', () => { isDown = false; });

      const riseBtn = document.getElementById('rise-btn');
      riseBtn.addEventListener('pointerdown', (e) => { 
        e.preventDefault(); 
        if(myEngine && !isMatchOver) myEngine.isRisingManualBtn = true; 
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
        riseBtn.addEventListener(ev, () => { if(myEngine) myEngine.isRisingManualBtn = false; });
      });

      window.addEventListener('keydown', (e) => {
        if (assigningAction && assignType === 'key') {
          e.preventDefault();
          keyConfig[assigningAction] = e.code;
          assigningAction = null;
          renderConfigUI();
          return;
        }
        if (!myEngine || myEngine.gameOver || isMatchOver) return;
        const code = e.code;
        let moved = false;
        
        if (code === keyConfig.Up) { e.preventDefault(); if (myEngine.cursor.y > 0) { myEngine.cursor.y--; moved = true; } }
        if (code === keyConfig.Down) { e.preventDefault(); if (myEngine.cursor.y < ROWS - 1) { myEngine.cursor.y++; moved = true; } }
        if (code === keyConfig.Left) { e.preventDefault(); if (myEngine.cursor.x > 0) { myEngine.cursor.x--; moved = true; } }
        if (code === keyConfig.Right) { e.preventDefault(); if (myEngine.cursor.x < COLS - 2) { myEngine.cursor.x++; moved = true; } }
        
        if (moved) SE.play('cursorMove');
        if (code === keyConfig.Swap) { e.preventDefault(); myEngine.swap(myEngine.cursor.x, myEngine.cursor.y); }
        if (code === keyConfig.Rise) { e.preventDefault(); myEngine.isRisingManualKey = true; }
        if (code === keyConfig.Target) { e.preventDefault(); cycleTarget(); }
      });

      window.addEventListener('keyup', (e) => {
        if (myEngine && e.code === keyConfig.Rise) myEngine.isRisingManualKey = false;
      });
    }

    // --- オンライン対戦 ---
    const PEER_PREFIX = 'pdw-26-';

    function generateShortRoomCode() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let res = '';
      for (let i = 0; i < 4; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
      return res;
    }

    function createRoom() {
      let code = document.getElementById('peer-room-id').value.trim();
      if (!code) { code = generateShortRoomCode(); document.getElementById('peer-room-id').value = code; }
      const fullPeerId = PEER_PREFIX + code.toUpperCase();
      
      if (peer) { try { peer.destroy(); } catch(e){} }
      peer = new Peer(fullPeerId);

      peer.on('open', () => {
        document.getElementById('peer-info').innerHTML = `部屋コード: <b style="font-size:1.3rem; color:#ff007f;">${code.toUpperCase()}</b><br>最大4人まで参加可能！相手にコードを伝えてください`;
        navigator.clipboard?.writeText(code.toUpperCase()); 
        showToast(`部屋コード [${code.toUpperCase()}] をコピーしました！待機中...`);
      });

      peer.on('connection', (c) => {
        if (onlineConnections.length >= 3) {
          c.close(); return;
        }
        onlineConnections.push(c);
        bindConnEvents(c, onlineConnections.length - 1);
        startOnlineGame(onlineConnections.length + 1);
      });
    }

    function joinRoom() {
      const code = document.getElementById('peer-room-id').value.trim();
      if (!code) { showToast('部屋コードを入力してください'); return; }
      const targetPeerId = PEER_PREFIX + code.toUpperCase();

      if (peer) { try { peer.destroy(); } catch(e){} }
      peer = new Peer();

      peer.on('open', () => {
        const c = peer.connect(targetPeerId);
        c.on('open', () => { 
          onlineConnections = [c];
          bindConnEvents(c, 0); 
          startOnlineGame(2);
        });
        c.on('error', () => { showToast('部屋への接続に失敗しました'); });
      });
    }

    function bindConnEvents(c, index) {
      c.on('data', (data) => {
        if (data.type === 'sync') {
          if (opponents[index] && opponents[index].engine && !isMatchOver) {
            opponents[index].engine.grid = data.grid;
            opponents[index].engine.nextRow = data.nextRow;
            opponents[index].engine.riseOffset = data.riseOffset;
            opponents[index].engine.score = data.score;
            if (data.garbageQueue) opponents[index].engine.garbageQueue = data.garbageQueue;
          }
        } else if (data.type === 'distribute_garbage') {
          if (myEngine && !isMatchOver) {
            let myBlocks = 0;
            if (data.targetOppId === 'player') {
              myBlocks = Math.floor(data.totalBlocks * 0.5);
            } else {
              myBlocks = Math.floor((data.totalBlocks * (data.targetOppId ? 0.5 : 1.0)) / (opponents.length + 1));
            }
            if (myBlocks > 0) sendBlocksToOpponent({ engine: myEngine }, myBlocks, data.isHard);
          }
        } else if (data.type === 'leave') {
          if (opponents[index] && opponents[index].engine) {
            opponents[index].engine.gameOver = true;
            checkMatchEnd();
          }
        }
      });
      c.on('close', () => {
        if (opponents[index] && opponents[index].engine) {
          opponents[index].engine.gameOver = true;
          checkMatchEnd();
        }
      });
    }

    // ==========================================
    // 自動リサイズ・対戦人数別レイアウト (完全修正版)
    // ==========================================
    function adjustLayout() {
      const isPortrait = window.innerHeight > window.innerWidth;
      const W = window.innerWidth;
      const H = window.innerHeight;
      const isLeft = document.getElementById('handedness-toggle')?.checked;
      const isLandscapeLarge = W >= 900 && !isPortrait;
      const oppCount = opponents.length;

      const myWrapper = document.getElementById('my-wrapper');
      const rivalsArea = document.getElementById('rivals-area');
      const rivalsTopArea = document.getElementById('rivals-top-area');
      const controls = document.getElementById('controls-container');
      const exitBtn = document.getElementById('exit-btn');
      const gameArea = document.getElementById('game-area');
      const gameContainer = document.getElementById('game-container');
      const handednessWrapper = document.getElementById('handedness-wrapper');

      if (!myWrapper || !controls || !exitBtn || !gameArea || !gameContainer) return;

      controls.style.alignItems = 'center';

      if (isLandscapeLarge) {
        // -------------------------------------------------------------
        // 【横画面・大画面】：全モード共通で横一列
        // -------------------------------------------------------------
        rivalsTopArea.style.display = 'none';
        rivalsArea.style.display = oppCount > 0 ? 'flex' : 'none';

        if (exitBtn.parentNode !== gameArea) gameArea.appendChild(exitBtn);
        exitBtn.className = 'action-btn retire-btn absolute-top';
        exitBtn.style.position = '';
        exitBtn.style.width = '';
        exitBtn.style.margin = '';
        if (isLeft) { exitBtn.style.right = '15px'; exitBtn.style.left = 'auto'; }
        else { exitBtn.style.left = '15px'; exitBtn.style.right = 'auto'; }

        opponents.forEach((_, i) => {
          const el = document.getElementById(`rival-wrapper-${i}`);
          if (el) {
            if (el.parentNode !== rivalsArea) rivalsArea.appendChild(el);
            el.style.order = '';
            el.style.position = '';
            el.style.transform = '';
            el.style.margin = '0';
            el.style.width = '';
            el.style.flexShrink = '';
          }
        });

        rivalsArea.style.flexDirection = 'row';
        rivalsArea.style.gap = '10px';

        controls.style.height = '';
        controls.style.justifyContent = 'flex-end';
        if (handednessWrapper) handednessWrapper.style.marginTop = '0';

        gameContainer.style.position = 'relative';
        gameContainer.style.top = '';
        gameContainer.style.left = '';
        gameContainer.style.transform = '';
        gameContainer.style.width = '100%';
        gameContainer.style.height = '100%';
        gameContainer.style.flexDirection = 'row';
        gameContainer.style.alignItems = 'center';
        gameContainer.style.justifyContent = 'center';
        gameContainer.style.padding = '10px';

        const totalBoards = 1 + oppCount;
        const availableW = W - 140;
        const baseBoardW = 224;
        let scale = Math.min(1.0, (H - 80) / 515);
        if ((baseBoardW * totalBoards + 20 * totalBoards) * scale > availableW) {
          scale = availableW / (baseBoardW * totalBoards + 20 * totalBoards);
        }
        scale = Math.max(0.4, scale);

        myWrapper.style.transform = `scale(${scale})`;
        myWrapper.style.margin = `0 ${(baseBoardW - baseBoardW * scale) / -2}px`;

        opponents.forEach((_, i) => {
          const el = document.getElementById(`rival-wrapper-${i}`);
          if (el) {
            el.style.transform = `scale(${scale})`;
            el.style.margin = `0 ${(baseBoardW - baseBoardW * scale) / -2}px`;
          }
        });

        controls.style.transform = `scale(${scale})`;

      } else if (oppCount <= 1) {
        // -------------------------------------------------------------
        // 【縦画面・小画面】：2人対戦 (最初のコードを完全に復元して堅持)
        // -------------------------------------------------------------
        rivalsTopArea.style.display = 'none';
        rivalsArea.style.display = 'none';

        if (exitBtn.parentNode !== gameArea) gameArea.appendChild(exitBtn);
        exitBtn.className = 'action-btn retire-btn absolute-top';
        exitBtn.style.position = '';
        exitBtn.style.width = '';
        exitBtn.style.margin = '';
        if (isLeft) { exitBtn.style.right = '12px'; exitBtn.style.left = 'auto'; }
        else { exitBtn.style.left = '12px'; exitBtn.style.right = 'auto'; }

        gameContainer.style.position = 'relative';
        gameContainer.style.top = '';
        gameContainer.style.left = '';
        gameContainer.style.transform = '';
        gameContainer.style.width = '100%';
        gameContainer.style.height = '100%';
        gameContainer.style.flexDirection = 'row';
        gameContainer.style.alignItems = 'center';
        gameContainer.style.justifyContent = 'center';
        gameContainer.style.paddingBottom = '0px'; 
        gameContainer.style.paddingTop = '0px';

        if (oppCount === 1) {
          const rivalWrapper = document.getElementById('rival-wrapper-0');
          if (rivalWrapper) {
            if (rivalWrapper.parentNode !== controls) {
              controls.insertBefore(rivalWrapper, controls.firstChild);
            }
            rivalWrapper.style.setProperty('order', '-1', 'important');

            const rivalScale = 110 / 224; 
            const originalRivalH = 510;
